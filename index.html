ymbolizing the strong foundation created by BIS over 80 years. The map of India represents BIS’s nationwide contribution to quality infrastructure, while the flowing saffron, white and green elements symbolize India’s progress towards a Viksit Bharat. The upward movement conveys innovation, growth and a stronger future. Supporting visual elements represent Quality, Standards, Safety, Testing, Conformity Assessment and Consumer Confidence—key pillars of BIS’s mission. The design is simple, distinctive and scalable, making it suitable for digital platforms, print, official documents, banners, merchandise and social media, while retaining clarity in colour and monochrome formats.","name":"LaxmanHadarage","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789853854_e504ef2d.png"]},{"id":129985,"date":"20-09-2026 03:08:33","text":"This design puts the BIS logo at the top showing its important role in Indias journey with standardization.\n\nThe number 80 is made with a human-centered part inside the zero representing consumers, families and a safer everyday life. The. The leaf show protection, well-being and growth that lasts.\n\nThe logo shows BISs goal of quality, safety and reliability for people for businesses and, for the nation.\n\nThe logo is simple, clean and well-balanced which makes it easy to use on all types of media in both color and black and white.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789853875_687407bb.png"]},{"id":129984,"date":"20-09-2026 03:01:51","text":"“BIS@80 – Precision, Trust and Progress”\n\nThe BIS@80 commemorative identity celebrates eight decades of the Bureau of Indian Standards as the foundation of quality, safety and consumer confidence in India. The stylised “8” represents continuity and continuous improvement, with precision-inspired markers reflecting measurement, testing and standardisation. The “0” is conceived as a strong quality and conformity ring, placing the official BIS emblem at its heart to emphasise that BIS remains central to India’s quality infrastructure. \nBIS blue represents trust, reliability and institutional strength. The flowing saffron and green elements, balanced by white space, reflect India’s national identity while their forward movement symbolises progress towards Viksit Bharat. Together, the elements connect an 80-year legacy of standards with a future driven by quality, innovation, safety and informed consumer choice.","name":"Neelakamal Mohapatra","dob":"11-10-1973","age":46,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789853425_6207a2ac.png"]},{"id":129973,"date":"20-09-2026 01:46:06","text":"The BIS@80 logo commemorates eight decades of the Bureau of Indian Standards’ journey in promoting quality, safety, reliability and consumer confidence across India.\nThe existing BIS logo is integrated into the design as the foundation of the visual identity, representing BIS’s enduring commitment to standardization and quality. The bold “80” symbolises eight decades of service and progress. The map of India, combined with an upward growth element, represents BIS’s contribution to national development and the vision of a Viksit Bharat.\nThe flowing Indian tricolour reflects unity, progress and national pride. The supporting visual elements represent BIS’s key areas of impact, including standards, testing, conformity assessment and consumer awareness.\nThe clean and distinctive design is intended to be easily recognisable, scalable and effective across digital platforms, print, official documents, social media, banners and merchandise, in both colour and monochrome formats.\nBIS@80","name":"ParthChanne","dob":"14-02-2009","age":14,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789848943_1d0a7749.png"]},{"id":129961,"date":"20-09-2026 01:00:30","text":"This logo celebrates BIS@80 (1947-2027) with the official BIS mark at the center, symbolizing quality and trust. The laurel wreath signifies 80 years of excellence and honour. Tricolor bands (saffron, white, green) and Ashok Chakra represent Viksit Bharat. The text 'CELEBRATING 80 YEARS - EXCELLENCE QUALITY STANDARDS TRUST' reflects BIS's core values of standardization, consumer confidence and nation building. Design is scalable in color and monochrome.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789846056_1a15594e.jpeg"]},{"id":129953,"date":"20-09-2026 00:41:36","text":"The BIS@80 identity celebrates eight decades of building trust through quality and standards. The continuous curves of “8” represent an enduring commitment to improvement, while the enclosing “0” symbolises assurance, safety and consumer confidence.\n\nThe BIS emblem sits at the heart of the anniversary mark, connecting its institutional heritage with its future mission. Blue conveys reliability and precision; the upward red accent expresses progress towards a Viksit Bharat supported by strong quality infrastructure.\n\nThe dates 1947–2027 connect this milestone with an eight-decade journey. Simple geometry and clear typography bring together the values of standardization, testing, conformity assessment and consumer awareness in a unified commemorative identity.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789845082_25151ac8.pdf"]},{"id":129947,"date":"20-09-2026 00:32:46","text":"भारतीय मानक ब्यूरो के 80 गौरवशाली वर्षों पर हार्दिक शुभकामनाएँ!\n\nमानक: पथप्रदर्शक: के सिद्धांत पर चलते हुए आपने देश को गुणवत्ता और विश्वास की नई राह दिखाई है।\n\nहम गर्व के साथ BIS प्रमाणित हैं।\n\n80 वर्षों का विश्वास - 80 वर्षों की गुणवत्ता\n\nटीम यूनाइटेड इंटरप्राइजेज | यूई प्रेशर कुकर","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789844372_3a3abce8.jpeg"]},{"id":129940,"date":"20-09-2026 00:13:25","text":"लोगो की संकल्पना\nयह लोगो BIS@80 के 80 गौरवशाली वर्षों की यात्रा, उपलब्धियों और भविष्य के प्रति प्रतिबद्धता को दर्शाता है। लोगो में “80” को मुख्य रूप से प्रस्तुत किया गया है, जिसमें निरंतर आगे बढ़ने, विकास और विश्वास की भावना दिखाई देती है।\n“80” के एक भाग में BIS का प्रतीक रखा गया है, जो भारतीय मानकों, गुणवत्ता और विश्वसनीयता की पहचान है। दूसरे भाग में भारत की प्रगति को दर्शाने वाले उद्योग, तकनीक, पर्यावरण, उपभोक्ता और आधुनिक विकास से जुड़े प्रतीकों का प्रयोग किया गया है। ये प्रतीक बताते हैं कि BIS के मानक हमारे दैनिक जीवन से लेकर उद्योग और आधुनिक तकनीक तक महत्वपूर्ण भूमिका निभाते हैं।\nलोगो में केसरिया, सफेद और हरे रंग का प्रयोग भारत की राष्ट्रीय पहचान और देश के प्रति BIS की सेवा भावना को दर्शाता है। गहरा नीला रंग विश्वास, स्थिरता, गुणवत्ता","name":"Vanshkumar","dob":"06-02-2006","age":17,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789843305_be1829de.png"]},{"id":129934,"date":"20-09-2026 00:00:29","text":"The BIS@80 logo celebrates eight decades of BIS’s commitment to quality, safety, reliability and consumer confidence. The “80” is designed as a continuous, flowing form, symbolising BIS’s enduring journey and its forward-looking role in India’s progress. The existing BIS emblem is integrated into the design as the foundation of the numeral, representing standards as the bedrock of a safe, reliable and quality-conscious nation.\n\nThe flowing forms and Indian-inspired colours reflect India’s journey towards a stronger and more developed future. The sense of movement represents how standardization, testing, conformity assessment and consumer awareness enable informed choices, support innovation and strengthen everyday life.\n\nThe clean and distinctive design is scalable and suitable for digital, print, merchandise and official applications, while remaining recognisable in both colour and monochrome. It represents 80 years of trust, with a vision for a quality-driven Viksit Bharat.","name":"PINTU_110","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789842432_6d3c4d7a.png"]},{"id":129928,"date":"19-09-2026 23:52:12","text":"The BIS@80 commemorative logo celebrates 80 years of the Bureau of Indian Standards, from 1947 to 2027, and its contribution to quality, safety, reliability and consumer confidence in India.\nThe central “80” represents eight decades of progress and a strong foundation built through standardization. The BIS Standard Mark connects the anniversary with trust and quality assurance.\nThe flowing Indian tricolour symbolizes India’s journey of unity, growth and transformation, while its upward movement reflects the vision of a Viksit Bharat. The globe and verification mark represent testing, conformity assessment, reliability and India’s connection with global standards.\nThe India map, people, infrastructure, technology, cities and renewable energy represent how standards support everyday life, innovation and sustainable development.\nTogether, the design conveys 80 years of trusted standards forming the foundation for a safer India.","name":"AshvithasreeM","dob":"06-03-2008","age":17,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789842029_c17c3fca.jpeg"]},{"id":129927,"date":"19-09-2026 23:50:06","text":"The BIS@80 logo celebrates 80 years of the Bureau of Indian Standards as a symbol of quality, safety, reliability and trust. The existing BIS logo is integrated as the central identity of the design, preserving the organisation’s established visual recognition.\n \nThe number “80” represents the remarkable journey of BIS and its continuing commitment to setting standards for a better and safer India. The circular form symbolises continuity, consistency and the ongoing evolution of standards with changing times. The flowing connection between the BIS identity and “80” represents the link between the strong foundation built over the years and a progressive future.\n \nThe clean and minimal design makes the logo distinctive, memorable and easily recognisable. It is designed to remain effective in both colour and monochrome formats and to work across digital platforms, print media, official documents, banners, social media, publicity material and merchandise.","name":"ANURAGYADAV","dob":"14-09-2007","age":15,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789841934_83add05d.png"]},{"id":129925,"date":"19-09-2026 23:37:37","text":"This logo represents the 80-year journey of BIS in building trust, quality and safety in India. The number 80 is kept at the centre to highlight this important milestone, while its flowing form represents continuity and the commitment to keep moving forward.\n\nThe BIS mark represents the trust associated with quality standards and certified products. The tricolour elements and Ashoka Chakra reflect India’s identity, progress and development. The shield-like form symbolises safety and protection, which are important foundations of standardisation.\n\nThe combination of blue, gold and tricolour accents represents trust, achievement and national pride. Overall, the design connects BIS’s 80 years of experience with India’s future of innovation, quality and safer living.\n\nBIS@80 — 80 years of standards, trust and a stronger India.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789840907_e12e3dba.png"]},{"id":129916,"date":"19-09-2026 23:08:35","text":"The Bureau of Indian Standards (BIS), the National Standards Body of India, in collaboration with MyGov, invites citizens to participate in the BIS@80 Commemorative Logo Design Competition as part of the celebrations marking its 80th Foundation Day on 6 January 2027.","name":"Akshanshmeshram","dob":"13-11-2009","age":13,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789839500_26c1a700.png"]},{"id":129905,"date":"19-09-2026 22:54:59","text":"Note – BIS@80\nThe BIS@80 logo celebrates 80 years of trust, quality, safety and reliability. The existing BIS logo is included as an integral part of the design to preserve the identity and legacy of BIS. The number “80” represents eight decades of service and continuous progress. The design uses simple and modern elements to show the journey of BIS from its foundation to the future. The colours and clean shapes represent trust, national identity, quality and growth. Overall, the logo reflects BIS’s commitment to standards, consumer confidence and a better-quality India.","name":"SherSingh","dob":"30-06-2008","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789838675_36e294b6.png"]},{"id":129902,"date":"19-09-2026 22:51:09","text":"This logo beautifully represents the values of quality, safety, purity, and trust. The BIS symbol at the centre reflects the importance of maintaining high standards and ensuring reliable quality in products and services.The tricolour-inspired green, orange, and white elements express a sense of Indian identity and pride. The Ashoka Chakra in the background symbolizes the nation’s heritage, progress, and integrity.\n\nThe words “Quality, Safety, Trust” and “Standard. Purity. Prosperity.” highlight the core principles behind standardization and consumer confidence. The “Years of Trust” message reflects the organization’s long-standing commitment to serving the nation.\n\nOverall, the logo conveys a simple yet powerful message: trusted standards, assured quality, and a commitment to a safer and better India.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789838445_5b16a5ea.jpg"]},{"id":129899,"date":"19-09-2026 22:50:25","text":"The BIS@80 logo celebrates 80 years of trust, quality, safety and reliability. The existing BIS logo is included as an integral part of the design to preserve the identity and legacy of BIS. The number “80” represents eight decades of service and continuous progress. The design uses simple and modern elements to show the journey of BIS from its foundation to the future. The colours and clean shapes represent trust, national identity, quality and growth. Overall, the logo reflects BIS’s commitment to standards, consumer confidence and a better-quality India.","name":"SherSingh","dob":"30-06-2008","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789838418_14f460e4.png"]},{"id":129894,"date":"19-09-2026 22:43:33","text":"This logo beautifully represents the values of quality, safety, purity, and trust. The BIS symbol at the centre reflects the importance of maintaining high standards and ensuring reliable quality in products and services.The tricolour-inspired green, orange, and white elements express a sense of Indian identity and pride. The Ashoka Chakra in the background symbolizes the nation’s heritage, progress, and integrity.\n\nThe words “Quality, Safety, Trust” and “Standard. Purity. Prosperity.” highlight the core principles behind standardization and consumer confidence. The “Years of Trust” message reflects the organization’s long-standing commitment to serving the nation.\n\nOverall, the logo conveys a simple yet powerful message: trusted standards, assured quality, and a commitment to a safer and better India.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789837936_2a3ee4df.jpg"]},{"id":129886,"date":"19-09-2026 22:33:07","text":"The BIS@80 logo represents a beautiful journey of 80 years of trust, quality, safety and national service. It is more than a logo; it is a visual story of India’s commitment to creating a culture of standards and excellence.\nThe central human figure symbolizes the people of India, who are at the heart of every standard. Its upward movement reflects aspiration, progress and the continuous journey towards a better and stronger future. The surrounding gear represents industry, technology, innovation and systematic development, showing how standards connect people, science and industries.\nThe BIS symbol at the centre represents quality, reliability and trust. The flowing tricolour strokes symbolize the spirit of India and the nation’s journey towards self-reliance and global excellence. The combination of saffron, white, green and deep blue gives the logo a sense of patriotism, confidence, harmony and professionalism.\nThe bold “BIS@80” celebrates eight decades of dedication.","name":"BharatSuryavanshi","dob":"01-08-2024","age":0,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789837331_3f5cab9d.png"]},{"id":129885,"date":"19-09-2026 22:32:56","text":"BIS – 80 Years of Trust, Quality & Progress\n\nFor eight decades, the Bureau of Indian Standards (BIS) has played an important role in building trust through quality, safety, and reliable standards. From everyday products to modern technology and sustainable development, BIS standards help protect consumers and support national growth. As India moves towards a safer, greener, more inclusive and progressive future, BIS continues to turn quality and standards into a stronger foundation for Viksit Bharat.","name":"JunaidSiddique","dob":"31-07-2005","age":21,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789837354_739fb7fb.jpg"]},{"id":129883,"date":"19-09-2026 22:32:33","text":"Keeping the second point of the pitch in mind, I considered this logo as a logo specifically for the 80th foundation day of BIS. I gave the integral place to the existing logo, while highlighting the completion of 80 years of BIS. The key in the logo represents the safety and confidentiality maintained by the department from last 80 years thereby proving their legacy and excellence. to relate more with the youth and other patriotic audience, I gave this key a Tricolor Flag gradient with 80, representing the years of existence, in the color of Ashoka Chakra. Thank You","name":"Mohammad Waqas Peer","dob":"26-08-2003","age":23,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789837341_4406055c.png"]},{"id":129874,"date":"19-09-2026 22:20:17","text":"The BIS@80 Commemorative Logo celebrates eight decades of the Bureau of Indian Standards (BIS) and its enduring contribution to quality, safety, reliability and standardisation in India.\nThe bold “80” symbolises eight decades while conveying continuity, growth and a forward-looking vision. The BIS emblem reflects the institution’s identity and commitment to national standards, while the Ashoka Chakra represents India’s heritage, progress and aspirations.\nThe flowing saffron, white and green elements embody the spirit of India and signify progress, innovation and continuous improvement. Deep blue represents trust, credibility, stability and excellence.\nThe clean and contemporary composition is designed to be distinctive, memorable and versatile across print, digital and institutional applications.\nOverall, the logo embodies “80 Years of Standards, Trust and Progress”, honouring BIS’s legacy while representing its continued journey towards a safer, stronger and quality-driven India.","name":"Kartik Khadsodni","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789836588_adabf7a6.png"]},{"id":129868,"date":"19-09-2026 22:14:50","text":"My concept for the BIS@80 logo is inspired by the idea of “Standards for a Developed India.” I wanted the design to tell a story rather than simply show the number 80. Every element in the artwork represents how quality, safety and standards can contribute to the progress of our country.\nAt the centre, “BIS@80” is the main attraction. The bold blue and golden design represents trust, strength, excellence and a long journey of service. The number 80 is connected with images of modern India, showing that the journey of standards is closely linked with the growth and development of the nation.\nThe Ashoka Chakra placed above the design represents India’s identity and continuous progress. The modern buildings, metro, wind turbines and green surroundings represent a developed, modern and sustainable Bharat. \nI hope you liked my logo. Thank you","name":"BharatSuryavanshi","dob":"01-08-2024","age":0,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789836141_3082de48.png"]},{"id":129864,"date":"19-09-2026 22:12:41","text":"First of all, the upward-flowing arrow in the colours of the Indian flag represents BIS’s continuous progress and its contribution towards Viksit Bharat. The leaf symbolizes reliability, sustainability, and growth. The minimalist house represents citizens and everyday life, showing how BIS standards empower and protect people in their daily lives.\n\nThe upward flow of the design, moving from the minimalist house to the minimalist building, represents the reach of BIS from individual citizens and households to industries and the wider economy.\n\nThe check mark enclosed within the gear-like circular symbol represents quality, safety, standardization, certification, and innovation, highlighting BIS’s role in ensuring reliable standards and supporting technological and industrial progress.","name":"Ashutosh Singh Padamshri","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789835829_f318910a.jpg"]},{"id":129851,"date":"19-09-2026 21:58:28","text":"This commemorative logo celebrates 80 years of the Bureau of Indian Standards (BIS) as a symbol of trust, quality, safety and reliability. The bold “80” represents eight decades of service, while the integrated BIS identity preserves the organisation’s established recognition. The flowing tricolour elements represent India’s unity, progress and journey towards a stronger future. The circular form conveys continuity, standardisation and continuous improvement. The India map reflects BIS’s nationwide presence and contribution to quality across the country. Blue represents trust and professionalism, while gold highlights the importance and prestige of this milestone. The clean and modern design is intended to work effectively across digital platforms, publications, products, banners and official communications. Overall, BIS@80 represents eight decades of trusted standards and a continued commitment to building a safer, higher-quality and more reliable India.","name":"JohnJacobRhenius","dob":"19-01-2007","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789835301_d767c8e3.png"]},{"id":129846,"date":"19-09-2026 21:56:19","text":"This logo represents the BIS@80 journey of quality, safety, and trust in India. The three interlinked circular strokes symbolize continuity, unity, and the three pillars of Quality, Safety, and Trust. The green, white, and saffron colours reflect India’s national identity and the spirit of the nation. The BIS emblem at the centre represents standardization, testing, conformity assessment, and consumer protection. The Ashoka Chakra in the background symbolizes India’s progress, values, and continuous development. The bold “80 Years of Trust” highlights BIS’s long-standing contribution to society. Overall, the design combines Indian identity, innovation, reliability, and public confidence in standards.","name":"AiswaryaVinod","dob":"23-02-2007","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789835136_4c861b7c.png"]},{"id":129842,"date":"19-09-2026 21:49:09","text":"BIS@80 Logo – Concept Note\n\nThe BIS@80 logo celebrates eight decades of the Bureau of Indian Standards as the nation's quality guardian. The design integrates the existing BIS logo at its core, symbolising continuity, trust, and India's standardisation journey.\n\nThe numeral \"80\" is creatively formed with flowing 3D ribbons in saffron, white, and green, representing national pride and the tricolour spirit. The smooth curves symbolise India's continuous growth towards a Viksit Bharat through strong quality infrastructure.\n\nThe circular forms suggest unity, protection, and the holistic reach of standards across every sector. The deep blue colour represents reliability and trust, while saffron and green reflect India's identity and progress.\n\nThe logo is simple, scalable, and effective in both colour and monochrome, suitable for digital platforms, official documents.","name":"HimanshiTyagi","dob":"25-08-2003","age":22,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789834697_66087870.png"]},{"id":129837,"date":"19-09-2026 21:38:55","text":"The BIS@80 logo celebrates 80 years of the Bureau of Indian Standards and represents its enduring commitment to quality, safety and standardisation in India.\nThe existing BIS emblem is retained as an integral part of the design, preserving the organisation’s established identity and credibility. The bold “80” symbolises eight decades of service and is highlighted in gold to represent excellence, trust and achievement.\nThe flowing saffron, white and green elements emerging around the “80” reflect India’s national identity and symbolise the organisation’s contribution to a stronger and more progressive nation. The sweeping form also conveys continuity, growth and forward movement.\nThe combination of BIS blue and gold creates a professional, authoritative and premium appearance while remaining suitable for official documents, digital platforms, merchandise, banners and publicity materials.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789834105_142c50f5.jpeg"]},{"id":129829,"date":"19-09-2026 21:31:20","text":"and innovation into a single premium visual. The use of the Indian tricolour—saffron, white, and green—along with the signature BIS blue creates a professional, patriotic, and contemporary appearance.\n\nAt the top of the poster, the message “Viksit Bharat 2047” represents the vision of a developed and progressive India. It is supported by imagery of modern skyscrapers, bridges, railways, renewable-energy systems, and advanced infrastructure. These elements create a futuristic environment and communicate the idea of India moving toward a technologically advanced and sustainable future. The open","name":"SAURABHYADAV","dob":"05-06-2006","age":20,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789833549_c83423d6.png"]},{"id":129815,"date":"19-09-2026 21:18:36","text":"This commemorative logo design visually encapsulates the Bureau of Indian Standards’ (BIS) monumental 80-year legacy of steering national quality, reliability, and consumer protection.The structural design is anchored by a stylized \"80\", where the number \"8\" is fashioned as a continuous infinity loop. This represents an everlasting, multi-decade commitment to trust, safety, and empowering citizens. The existing, iconic BIS logo is seamlessly integrated within the loop of the digit \"0\", signifying that past legacy and future standards are bound cohesively.An ascending tricolor arc flows across the typography, representing rigorous testing and conformity assessment while reflecting India’s rising trajectory. Ultimately, the clean, scalable, and modern aesthetic highlights BIS not just as a regulatory body, but as the strong infrastructure bedrock powering a self-reliant, globally competitive, and prosperous Viksit Bharat.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789832901_795e0b5b.jpg"]},{"id":129799,"date":"19-09-2026 20:55:36","text":"“BIS@80 celebrates eight decades of trusted standards through the unity of BIS identity, Indian heritage, quality, safety, innovation, technology and sustainable national progress.”","name":"Suraj Kumar Mukti","dob":"17-02-1975","age":48,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789831406_1ed76811.png"]},{"id":129796,"date":"19-09-2026 20:52:04","text":"80 Years of Trust, Quality & Standards\n80 Years of Setting Standards, Shaping India\nFrom Standards to Excellence — 80 Years of BIS\n80 Years of Quality. A Future of Possibilities.\nCelebrating 80 Years of Standards for a Stronger India\n80 Years — Legacy of Quality, Vision for Tomorrow","name":"Prince Bharti","dob":"19-10-2006","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789831310_c03cb4dc.png"]},{"id":129794,"date":"19-09-2026 20:51:29","text":"\"The BIS@80 commemorative logo celebrates eight decades of trusted standards and unwavering commitment to quality, safety, and consumer confidence. The design seamlessly integrates the number '80' with the official BIS emblem, symbolizing growth, precision, and forward-looking vision. A professional color palette of navy blue and gold evokes trust and excellence. Architectural lines reflect robust infrastructure, while a subtle motif honors national pride. This simple, scalable, and distinctive identity is tailored for diverse applications, reinforcing the institution's foundational role in building a developed nation.\"","name":"SAYANSARKAR","dob":"29-12-2006","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789831137_f8511b9f.jpg"]},{"id":129777,"date":"19-09-2026 20:27:51","text":"The 8 is one flowing form, showing continuity and BIS's progress across eight decades. The 0 is left open, standing for growth and innovation and for BIS's continuing role in India's quality ecosystem.\n\nBlue, orange and green sit at key points of the numeral. Blue stands for trust and reliability, orange for progress and energy, green for growth and the nation's aspirations. Placed there, they show how standards connect different parts of everyday life and build a stronger quality culture.\n\nThe form is bold and simple, so it stays recognisable on digital platforms, in print, on official communication, on merchandise and in public campaigns","name":"shrawan sundi","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789829833_bc2cbfae.jpg"]},{"id":129769,"date":"19-09-2026 20:22:32","text":"This commemorative logo dynamically celebrates 80 years of the Bureau of Indian Standards (BIS) by combining national pride, trust, and quality assurance into a clean, modern framework. The design features the number '80' prominently, where the top loop of the digit '8' seamlessly embeds the authentic BIS emblem along with its official Sanskrit motto \"मानक: पथप्रदर्शक:\", representing eight decades of setting benchmark standards for Indian industries. Inside the digit '0', a bold checkmark symbolizes verification, consumer trust, and certified quality. A graceful Tiranga wave flows across the center, connecting the digits to signify India's progress and commitment to excellence, while the bold navy blue BIS@80 typography at the bottom grounds the design with strong brand recognition and professional balance. Overall, it stands as a powerful visual identity honoring 80 years of institutional excellence and quality control in India.","name":"Pooja Wagh","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789829546_2c528c6f.png"]},{"id":129763,"date":"19-09-2026 20:15:54","text":"I'm glad to participate on this BUREAU OF INDIAN STANDARDS BIS@80 logo making competition,I have only a basic level knowledge in designing, did this thing on an online web application, My design says as it represents that it is celebrating its 80th foundation day so an 80 as a major component, and the tricolour represents our country, and it represents Quality & safety, Development, Innovation, It's impact on citizens and INDIA'S Development. Thank you for this opportunity to reveal my talent","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789827742_f739760b.png"]},{"id":129755,"date":"19-09-2026 20:09:49","text":"The BIS@80 logo celebrates eight decades of the Bureau of Indian Standards and its journey of building trust through quality, safety, reliability & standardization. The central “80” represents 80 years of service and India’s progress towards a stronger, quality-conscious future.\nThe existing BIS emblem is at the heart of the design, preserving its identity. The circular form represents continuity, trust and the lasting role of standards in daily life.\nInside the “8”, roads, bridges, buildings, greenery, renewable energy and connectivity represent India’s development & quality infrastructure. Tricolour bands symbolise national identity, unity and sustainable progress.\n“Quality • Safety • Reliability • Consumer Confidence” reflects BIS’s core values. “Standards for a Stronger Tomorrow” expresses its vision, while “Viksit Bharat” connects standards with India’s development.\nThe design is simple, distinctive and scalable, suitable for digital, print, documents, banners & social media .","name":"Hamza Raza","dob":"22-10-2003","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789828695_d5931159.png"]},{"id":129750,"date":"19-09-2026 20:06:36","text":"This BIS@80 logo combines a modern and simple design with the original BIS logo placed at the center of the \"0” in 80, showing that the BIS identity is an integral part of its 80-year journey. The flowing elements and clean design represent progress and the connection with India. The words “QUALITY • TRUST • SAFETY” highlight the key values that BIS works to promote through standards, testing, safety and consumer confidence.","name":"AvinashKumar","dob":"01-10-2012","age":11,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789828580_1f4a43a5.png"]},{"id":129745,"date":"19-09-2026 20:03:44","text":"The BIS@80 logo commemorates eight decades of the Bureau of Indian Standards’ journey in strengthening India’s culture of quality, safety, reliability and consumer confidence.\nAt the centre, the existing BIS emblem anchors the design, representing the institution’s identity and its foundational role in India’s quality infrastructure. The surrounding circular elements symbolise key facets of BIS’s work, including standardisation, testing, certification, conformity assessment, quality assurance and consumer awareness.\nThe prominent “80” represents eight decades of service and achievement. Its continuous, flowing form reflects BIS’s evolving journey from its rich legacy towards a future driven by innovation, quality and progress. The Ashoka Lion Capital integrated within the “0” represents India’s national identity, integrity and commitment to public service. Overall, the design brings together heritage, national identity and trust in a distinctive and adaptable visual identity.","name":"DivyanshiChoudhary","dob":"28-11-2003","age":22,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789828203_13fbc51c.pdf"]},{"id":129730,"date":"19-09-2026 19:47:48","text":"The BIS@80 logo celebrates eight decades of the Bureau of Indian Standards’ commitment to quality, safety, trust, and consumer welfare. The number “80” prominently integrates the BIS emblem, symbolizing the strong foundation of standardization in India since 1947. The circular segment highlights BIS’s core functions: Standardization, Testing, Certification, Conformity Assessment, and Consumer Awareness. The map of India, modern infrastructure, renewable energy, transportation, research, and industry depict national growth powered by quality standards. The upward Tricolour arrow represents progress towards a Viksit Bharat. Together, the design reflects BIS’s enduring role in enabling safer products, informed consumer choices, innovation, sustainability, and national development.","name":"Avani Goyal","dob":"17-10-2008","age":12,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789827258_13f69c11.png"]},{"id":129729,"date":"19-09-2026 19:46:38","text":"This logo represents 80 years of BIS’s commitment to quality, safety, reliability and trusted standards. The number “80” symbolizes eight decades of service, while the clean and modern design reflects BIS’s continued journey towards innovation, excellence and a Viksit Bharat. The design is created to remain clear, recognizable and adaptable across digital and print platforms.","name":"bhoomichhatbar","dob":"22-07-2002","age":24,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789827336_5922be6c.png"]},{"id":129724,"date":"19-09-2026 19:37:02","text":"Concept Note - BIS@80 Commemorative Logo\n\nThis minimalist and modern logo celebrates 80 glorious years of the Bureau of Indian Standards (BIS) and its commitment to the nation.\n\nThe Tricolor Ribbon '80': The continuous ribbon forming the number '80' represents India's endless journey of progress and sustainable growth. The integration of the Indian Tricolor (Saffron, White, Green) symbolizes the pride of a Viksit Bharat.\n\nThe Shield & Checkmark: Placed elegantly inside the number '8', the shield with a checkmark signifies consumer protection, safety, and unshakeable trust—the core values of BIS.\n\nThe Core Identity: The clean circular space gracefully houses the original BIS logo, bridging its 80-year legacy with a modern future.\n\nColor Palette: The deep corporate navy blue stands for global standards, reliability, and professionalism.\n\nThis design is clean, scalable, and perfectly captures the vision of \"80 Years of Trust\" and \"Standards Building India\".","name":"Bhaliya Mehul Gopalbhai","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789826748_56b49cda.png"]},{"id":129709,"date":"19-09-2026 19:21:39","text":"The design keeps the original BIS hexagon fully intact as its anchor, with a bold ribboned \"80\" rising from it — as though BIS's own identity has grown into this milestone. Tricolour arcs sweep into an ascending green arrow, showing BIS driving India toward a Viksit Bharat, while a quiet skyline of factories, buildings and wind turbines represents the quality infrastructure it enables. Six icons below distil BIS's core work — standardisation, testing, conformity assessment, certification, consumer awareness and citizen empowerment — into a story anyone can read at a glance. Framed in navy and white, the mark stays clear in colour or monochrome, on a banner or a lapel pin alike.","name":"Yuvraj","dob":"10-12-2010","age":15,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789825883_5fe77e99.pdf"]},{"id":129706,"date":"19-09-2026 19:20:42","text":"The official BIS logo is incorporated as an integral part of the BIS@80 commemorative logo, symbolizing 80 years of quality, trust, and standardization in India.","name":"IramNoorin","dob":"15-02-2006","age":20,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789825809_aafb0a93.png"]},{"id":129701,"date":"19-09-2026 19:12:02","text":"The BIS@80 commemorative logo celebrates 80 years of trust, quality, safety and national progress. The central “80” represents eight decades of BIS’s contribution to developing and promoting standards across India.\nThe official BIS identity is integrated to retain the organisation’s heritage and recognition. The Indian tricolour ribbon reflects the nation’s journey, while the circular form symbolizes continuity, unity and the nationwide reach of standards.\nThe supporting elements represent safety, industry, sustainability, innovation and society—highlighting the wide impact of BIS standards on everyday life.\n“1947–2027” marks the journey towards the 80th anniversary and connects BIS’s legacy with its vision for the future. The clean, modern design ensures versatility across digital platforms, official documents, products and public campaigns.\nOverall, the logo reflects BIS’s enduring commitment to quality, innovation, sustainability and  trust, while celebrating eight decades of","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789825256_596d68e0.png"]},{"id":129685,"date":"19-09-2026 18:43:05","text":"The BIS@80 logo celebrates 80 years of the Bureau of Indian Standards and its contribution to quality, safety, reliability, and innovation in India. The design combines the official BIS identity with modern and patriotic elements. The blue colour represents trust, stability, and professionalism, while saffron and green reflect India’s spirit and progress. The Ashoka Chakra-inspired element connects the logo with India’s national identity. The rising shapes and human figures represent unity, teamwork, growth, and a better future. The golden star symbolises achievement and excellence. “SINCE 1946” highlights the organisation’s long journey, while “TRUSTED FOR A SAFER TOMORROW” expresses its vision for a safe and reliable future. Overall, the design combines heritage, innovation, trust, and national pride in a simple and memorable way.","name":"Mohit Bharat Jadhav","dob":"24-04-2010","age":16,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789823571_4fd5cfeb.jpg"]},{"id":129684,"date":"19-09-2026 18:40:59","text":"इस डिज़ाइन में BIS के 80 सालों के सफर और इसके भविष्य के विज़न को बहुत ही सहजता से पिरोया गया है।\n​इसके बिल्कुल बीच में '80' अंक को BIS के मूल लोगो (\"मानक: पथप्रदर्शक:\") के साथ जोड़ा गया है, ताकि संस्था की पुरानी विरासत और पहचान कायम रहे। अगर आप ध्यान से देखें, तो अंक '8' के निचले हिस्से में तिरंगे की लहरें नजर आती हैं, जो यह बताती हैं कि राष्ट्र-निर्माण और देश की तरक्की में मानकों का कितना बड़ा हाथ है।\n​इस पूरे लोगो को एक सुनहरे घेरे ने बांध रखा है। इस घेरे में छह छोटे आइकॉन शामिल किए गए हैं—भरोसा, सुरक्षा, मानक, गुणवत्ता, प्रगति और 'विकसित भारत'। ये कोई आम आइकॉन नहीं हैं, बल्कि वो मजबूत स्तंभ हैं जिन पर हमारी अर्थव्यवस्था टिकी है।\n​नीचे दी गई टैगलाइन—\"FOR A SAFER • STRONGER • DEVELOPED INDIA\"—पूरी डिज़ाइन को एक दमदार संदेश के साथ पूरा करती है और एक सुरक्षित व सशक्त भारत बनाने के हमारे इरादे को सीधे तौर पर सामने रखती है।","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789823444_7adef596.png"]},{"id":129682,"date":"19-09-2026 18:38:25","text":"The BIS@80 logo represents the 80-year journey of the Bureau of Indian Standards and its contribution towards quality, safety, reliability and consumer confidence. The large “80” is the main element of the design, while the BIS logo is placed within the “0” to connect the anniversary directly with the organisation. The saffron, white and green strokes move upwards and end in an arrow, representing India’s progress, continuous improvement and the journey towards higher standards. The blue colour represents trust and reliability associated with BIS. The overall design is kept simple and clean so that the logo can be easily recognised and used on different platforms, including digital media, print, official documents, banners and merchandise.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789823143_a4f95fa9.jpeg"]},{"id":129679,"date":"19-09-2026 18:34:00","text":"The Number \"80\": Forms the core visual anchor, symbolizing eight decades of dedicated service in fostering India's quality infrastructure.The BIS Emblem: Embedded neatly within the loop of the number \"0\" is the official tri-directional symbol of the Bureau of Indian Standards. It includes its canonical Sanskrit motto, \"Manakah Pathapradarsakah\" (मानकः पथप्रदर्शकः), translating to \"Standards are the guide\".Flowing Tricolour Ribbon: Saffron, white, and green streaks curve smoothly through the numbers, reflecting national progress, unity, and a shared journey toward a developed nation.The Rising Arrow: The ribbon culminates in an upward-pointing blue arrow, signifying ongoing industrial growth, modern infrastructure, and future-forward innovation.Core Values & Vision: Displayed at the bottom are the English pillars \"Quality | Safety | Trust | Viksit Bharat\" accompanied by their Hindi equivalents, highlighting BIS's contribution to building a resilient and self-reliant country.","name":"Arvind Singh Panwar","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789822871_b56f3380.png"]},{"id":129677,"date":"19-09-2026 18:29:13","text":"The central identity is BIS@80, making the 80th Foundation Day immediately visible and memorable. The number 80 is the most prominent visual element because it represents eight decades of BIS’s journey in building a culture of quality, standardisation, safety and reliability in India.\n\nThe existing BIS emblem is placed prominently beside the anniversary mark. This is important because the anniversary identity is not meant to replace BIS’s established identity; instead, it connects the organisation’s heritage and credibility with its 80-year milestone. The familiar BIS symbol represents standards, conformity and the institution’s long-standing role in quality infrastructure.\n\nThe large 8 symbolises the eight decades of BIS. Its flowing form gives the impression of continuity, movement and an uninterrupted journey from the past towards the future. The “0” creates a sense of completeness and also provides space for a people-oriented symbol, representing how standards ultimately serve","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789822549_d1eba66e.pdf"]},{"id":129673,"date":"19-09-2026 18:24:57","text":"My logo concept represents the rich heritage, knowledge, innovation and prosperity of ancient India while connecting them with the modern vision of BIS. The design combines traditional Indian architectural elements, a radiant sun, a lotus, an open book and the national tricolour to symbolize knowledge, growth, creativity and progress. The central figure represents the people and future generations carrying India's legacy forward. The BIS identity is integrated into the emblem, while “BIS@80” represents the organisation’s milestone and its journey towards a future built on quality, standards and innovation. The overall design aims to present BIS as a bridge between India’s timeless heritage and its modern aspirations.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789822381_0cd434ba.png"]},{"id":129620,"date":"19-09-2026 17:45:05","text":"**Concept Note – BIS@80**\n\nThe BIS@80 logo celebrates 80 years of trust, quality and service to the nation. The existing BIS logo is an integral part of the design, representing the strong identity and legacy built by BIS over the decades.\n\nThe bold “80” marks this important milestone, while its flowing form represents continuity, progress and the journey towards the future. The saffron and green elements bring a sense of Indian identity and symbolise energy and growth, while blue reflects trust, stability and professionalism. The circular, wheel-inspired element represents standards, precision and continuous improvement.\n\nThe simple and clean design is intended to remain recognisable across digital platforms, print, official documents, banners and merchandise. Overall, BIS@80 represents **80 years of trusted standards, meaningful progress and a commitment to a better-quality India.**","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789820487_e1012c49.png"]},{"id":129614,"date":"19-09-2026 17:38:59","text":"Concept Note:This logo is dedicated to the historic occasion of the 80th Foundation Day of the Bureau of Indian Standards (BIS). The number '80' at the center represents the eight decades of the institution's glorious journey, complemented by the tagline \"80 years of trust & quality\" which emphasizes BIS's core values. The surrounding wreath symbolizes success, growth, and dedicated service to the nation. The logo has been designed to look clear, distinct, and impactful in both color and black-and-white (monochrome) formats.","name":"fouziya bano","dob":"15-08-1993","age":33,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789819687_78855158.pdf"]},{"id":129607,"date":"19-09-2026 17:30:07","text":"The BIS@80 logo represents eight decades of India’s journey towards quality, safety and reliability. The number 80 forms the central visual identity, symbolising continuity and the long-standing contribution of BIS. The BIS logo is integrated into the design to represent its institutional identity. The shield and check mark signify safety, conformity and consumer confidence, while the gear represents standards, testing and innovation. The Indian tricolour sweep reflects national identity and BIS’s contribution to a stronger quality infrastructure. The upward movement represents progress towards a safer, more reliable and quality-conscious India.","name":"Shobhit Kashyap","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789819105_5b411200.png"]},{"id":129605,"date":"19-09-2026 17:29:03","text":"The BIS@80 logo celebrates eight decades of BIS's contribution to quality, safety, reliability and consumer confidence. The prominent “80” represents the milestone, while the flowing saffron, white and green elements symbolise India's identity, continuity and progress. The BIS logo anchors the design to the organisation's role in standardization and quality infrastructure. The map of India and Ashoka Chakra represent the nationwide reach and national significance of BIS. Indian heritage elements, including India Gate, classical dance, music and a mandala, reflect India's rich cultural identity. The safety shield, quality medal, gear and handshake represent safety, quality, standards, technical capability and consumer trust. Together, these elements portray BIS as a foundation for quality and a contributor to India's journey towards a Viksit Bharat.","name":"LaryaPreemalMascarenhas","dob":"26-05-2007","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789819082_e51335f0.pdf"]},{"id":129590,"date":"19-09-2026 17:08:58","text":"I am excited to participate in the BIS@80 Commemorative Logo Design Competition. My design represents the journey, trust, quality, standards, and innovation associated with BIS over the past 80 years. I have tried to create a simple, modern, and meaningful concept that reflects BIS’s contribution to quality and standardisation in India. I hope my design captures the spirit of BIS@80 and its vision for a stronger and better future. Thank you for providing this opportunity to showcase creativity.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789818284_8d6d68ca.png"]},{"id":129572,"date":"19-09-2026 16:53:18","text":"Hi Team, please find my submission attached.\n\nThe BIS@80 logo celebrates eight decades of India’s journey towards quality, safety and consumer confidence. The interlinked “80” symbolises continuity, progress and the foundation created by BIS. The BIS emblem represents standards and trust, while the human centred motif highlights empowered citizens and informed choices. The rising sun and India inspired elements reflect a brighter, developed India built on quality infrastructure. The flowing Tricolour ribbon represents national progress and BIS’s contribution to Viksit Bharat. Five supporting symbols represent standardisation, testing, conformity assessment, consumer awareness and quality confidence.","name":"Nirvighna Peetha","dob":"18-10-2012","age":8,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789816267_ee95717f.png"]},{"id":129564,"date":"19-09-2026 16:47:14","text":"The BIS@80 logo celebrates 80 years of the Bureau of Indian Standards (BIS) as a symbol of quality, trust, safety and excellence in India.\nThe design integrates the existing BIS logo as an integral visual element, preserving its strong identity while giving it a contemporary and celebratory expression. The number “80” represents eight decades of BIS’s contribution to standardisation and quality assurance, while the “@” symbol connects BIS’s legacy with India’s modern, technology-driven future.\nThe visual form is designed to convey continuity, progress and reliability—linking BIS’s rich heritage with its vision for the years ahead. The overall composition is simple, distinctive and easily recognisable, ensuring effective use across digital platforms, print media, official documents, banners, social media and merchandise .","name":"NikhilJauhari","dob":"19-01-2012","age":14,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789816544_22b08079.jpg"]},{"id":129544,"date":"19-09-2026 16:31:18","text":"This logo celebrates eight decades of BIS's commitment to quality, safety, and consumer confidence. The numeral “80” represents its enduring legacy, while the integrated BIS emblem symbolises standardisation and reliability. The flowing Indian tricolour reflects national unity and progress towards Viksit Bharat. The balanced geometric design conveys precision, trust, and BIS's continuing role in shaping a safer, stronger India.","name":"Sherly A P","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789815671_d1ad2393.png"]},{"id":129526,"date":"19-09-2026 16:13:46","text":"The BIS@80 logo celebrates 80 years of building quality, safety, reliability and consumer confidence in India. The bold 80 represents BIS’s eight-decade journey, while the integrated BIS identity reflects its trusted foundation. The people, infrastructure and green elements symbolise empowered citizens, progress, sustainability and Viksit Bharat. The tricolour flow represents national pride and forward movement, connecting BIS’s legacy with India’s quality-driven future.","name":"MohammedOsmanGhori","dob":"04-03-2006","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789814614_2097e4c0.png"]},{"id":129523,"date":"19-09-2026 16:06:23","text":"The BIS@80 logo celebrates 80 years of BIS and its continued commitment to quality, safety and trust. The 8 is designed as an infinity symbol, representing continuity and BIS’s enduring contribution to standardisation. The 0 uses flowing Indian tricolour elements, symbolising national progress and the vision of a Viksit Bharat. The official BIS logo is placed at the centre of the 0, representing BIS at the heart of India’s quality ecosystem. The design is kept simple, distinctive and scalable, with a monochrome version to ensure clarity across different applications.\nArtwork created in Adobe Illustrator (.AI).","name":"KashishSetia","dob":"11-06-2003","age":21,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789814164_98c68e6c.jpg"]},{"id":129518,"date":"19-09-2026 16:03:40","text":"अवधारणा विवरण – BIS@80\nBIS@80 का यह स्मारक लोगो भारतीय मानक ब्यूरो की आठ दशकों की गुणवत्ता, मानकीकरण, सुरक्षा, विश्वसनीयता और उपभोक्ता विश्वास के प्रति निरंतर प्रतिबद्धता को दर्शाता है। मौजूदा BIS प्रतीक को आधुनिक और प्रभावशाली “80” के साथ एकीकृत किया गया है, जो BIS की गौरवशाली विरासत और भविष्य की दिशा को एक साथ प्रस्तुत करता है।\n“80” के ऊपर बने आठ दृश्य तत्व BIS की आठ दशकों की यात्रा, सेवा और प्रगति का प्रतीक हैं। केसरिया और हरे रंग की प्रवाहमान आकृतियाँ भारत की प्रगति, आकांक्षाओं और विकसित भारत की यात्रा को दर्शाती हैं। नीला रंग विश्वास, विश्वसनीयता और संस्थागत मजबूती का प्रतीक है।\nसरल और स्पष्ट संरचना लोगो को डिजिटल एवं प्रिंट माध्यमों, आधिकारिक दस्तावेजों, सोशल मीडिया, बैनर और मर्चेंडाइज पर प्रभावी रूप से उपयोग योग्य बनाती है।\nयह लोगो मानकीकरण, परीक्षण, अनुरूपता मूल्यांकन और उपभोक्ता जागरूकता के माध्यम से गुणवत्ता को जन-जीवन का अभिन्न हिस्सा बनाने में BIS की भूमिका को दर्शाता है। यह आठ दशकों के भरोसेमंद मानकों से सुरक्षित, विश्वसनीय और गुणवत्तापूर्ण भविष्य की ओर भारत की यात्रा","name":"Nilesh Bharti","dob":"08-04-2003","age":15,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789813919_4662edd9.pdf"]},{"id":129517,"date":"19-09-2026 16:00:04","text":"The proposed BIS@80 logo celebrates eight decades of trust, quality, standardisation, and service to the nation. The existing BIS logo is retained as an integral and recognisable element, preserving the organisation’s established visual identity while giving it a contemporary anniversary expression. The bold “@80” symbol represents the milestone and continuity of BIS, while the Ashoka Chakra within the zero reflects India’s national identity, progress, and commitment to excellence. Saffron and green flowing elements add a subtle national character and convey growth, innovation, and forward movement. The clean composition, balanced proportions, and simple geometric forms make the logo distinctive, meaningful, and easily recognisable at different sizes. Its uncomplicated design allows effective reproduction in colour as well as monochrome without losing clarity or identity.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789813745_901ce53d.png"]},{"id":129515,"date":"19-09-2026 15:56:17","text":"Concept Note — BIS@80 Logo\n\nThe BIS@80 logo celebrates eight decades of the Bureau of Indian Standards and its continuing commitment to quality, safety and trust. The central “80” forms the core of the design, symbolising 80 years of setting standards and contributing to a stronger and more quality-conscious India.\n\nThe existing BIS logo is integrated within the “8”, preserving the identity and legacy of BIS while giving it a contemporary anniversary expression. The flowing saffron, white and green elements represent India’s national spirit, progress and unity. Their upward movement symbolises growth, innovation and BIS’s vision for the future.\n\nThe blue colour represents reliability, credibility, stability and trust, while the gold accent signifies achievement and the milestone of 80 years. The circular form of the “0” represents continuity, completeness and BIS’s ongoing journey towards","name":"ARSHDEEP SINGH","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789813558_b020bac3.png"]},{"id":129511,"date":"19-09-2026 15:54:03","text":"The design is kept simple and clear so that it can be easily recognised and used on documents, banners, social media, merchandise and other official materials. Overall, the logo represents BIS’s proud past, present achievements and continued journey towards a quality-driven India.\n\nThe BIS@80 logo represents the 80-year journey of the Bureau of Indian Standards and its important role in maintaining quality and standards in India.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789813392_dc9ecff5.png"]},{"id":129510,"date":"19-09-2026 15:50:59","text":"Essence of BIS is being reflected by logo. Existing BIS logo is the integral part of the proposed logo.\nThe design is simple but meaningful and easily markable with clarity and visual identity, no unnecessary jumble is made.","name":"Santanu Datta","dob":"11-09-1965","age":51,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789812776_1a85b394.jpg"]},{"id":129497,"date":"19-09-2026 15:34:39","text":"My logo celebrates BIS@80 by creatively combining the official BIS identity with a dynamic representation of the number “80”, symbolising eight decades of commitment to quality, safety, reliability and trust. The flowing form of the design represents continuity and the evolving journey of BIS from 1946 to 2026. The blue element reflects trust, stability and strong standards, while the saffron and green accents represent India, progress and national development. The circular movement conveys unity and a continuous commitment to improving quality standards. The upward elements symbolise growth, innovation and a forward-looking approach. Together, these elements represent BIS’s enduring contribution to building confidence among consumers and supporting quality-driven development. The overall design reflects the vision of a safer, stronger and quality-conscious India while marking 80 years of BIS’s journey.","name":"JishanAnsari_66","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789812255_47ef67cd.png"]},{"id":129493,"date":"19-09-2026 15:30:46","text":"80 Years of Excellence with BIS\nFor eight decades, the Bureau of Indian Standards (BIS) has served as the bedrock of quality, safety, and reliability across the nation. As India charges ahead toward the vision of Viksit Bharat 2047, standards remain the invisible force driving sustainable growth, modern infrastructure, and technological innovation.\nFrom powering renewable energy and expanding digital networks to driving advanced manufacturing and consumer safety, BIS ensures that every step forward meets world-class quality. The journey of standardisation bridges traditional trust with futuristic ambition, empowering industries, protecting consumers, and positioning India as a global leader in quality assurance.\nTogether, through continuous improvement, innovation, and an unyielding commitment to excellence, we build a safer, stronger, and self-reliant nation.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789812084_e209172f.jpg"]},{"id":129492,"date":"19-09-2026 15:28:33","text":"The BIS@80 logo celebrates 80 years of the Bureau of Indian Standards (1947–2027), highlighting India’s journey towards quality, safety, and reliability.\nThe central circular emblem illustrates the interconnected values of quality, safety, reliability, consumer confidence, standards, conformity assessment, and testing. The BIS symbol at its centre represents trust and assurance, while the Hindi motto “मानक: पथप्रदर्शक” conveys the guiding role of standards in building a better future.\nThe bottom icons reinforce the core principles of quality, safety, trust, and reliability.\nOverall, the design communicates BIS’s eight-decade commitment to protecting consumers, strengthening Indian industry, and building a safer, more reliable, and quality-conscious nation.","name":"RabbaniShaikadavi","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789811755_ffea7e8e.png"]},{"id":129475,"date":"19-09-2026 15:08:25","text":"The BIS@80 logo celebrates eight decades of the Bureau of Indian Standards as the foundation of quality, safety and reliability in India.\n\nThe design combines the number “80” with Indian folk-art elements, symbolising the connection between India’s cultural heritage and its journey towards a modern, quality-conscious nation. The BIS logo is placed at the centre, representing trust, standardisation and consumer confidence.\n\nThe two contrasting visual sections represent the importance of standards in everyday life. The brighter elements depict India’s progress through safe products, reliable infrastructure, technology and sustainable development, while the darker elements represent the challenges of substandard products, misleading practices and the need for stronger awareness and accountability.\n\nThe Ashoka emblem and Indian-inspired patterns reinforce the national character of BIS. The circular composition represents continuity and BIS’s 80-year journey of serving citizens.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789810527_a23968c3.png"]},{"id":129473,"date":"19-09-2026 15:07:19","text":"BIS 80 Years Commemorative Logo\n\nA premium commemorative logo celebrating 80 years of the Bureau of Indian Standards (BIS) and its enduring commitment to trust, quality, safety, and consumer protection.\n\nThe design features a bold metallic-gold “80” as the central element, symbolizing eight decades of excellence. The Ashoka Chakra represents India’s heritage and national identity, while the blue verification mark conveys the message of products being Tested, Verified, and Approved.\n\nSet against a deep navy-blue background with elegant lighting and refined 3D detailing, the design delivers a prestigious and modern visual identity suitable for anniversary campaigns, digital media, official presentations, websites, and promotional materials.\n\nTagline:\nStronger Standards, Safer Tomorrows.","name":"AltamashKhan_264","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789810632_e78a170b.png"]},{"id":129469,"date":"19-09-2026 15:03:56","text":"Concept Note – BIS@80\n\nThe BIS@80 identity symbolises 80 years of building trust through quality. The flowing “80” represents an unbroken journey of standards, testing, certification and consumer confidence, connecting BIS’s legacy with India’s future.\n\nThe BIS emblem at the heart of the zero signifies that standards remain the foundation of this journey. The integrated gear and shield represent technical excellence, safety and assurance, while the forward pathway reflects progress towards a quality-driven Viksit Bharat.\n\nThe saffron, white and green accents express India’s aspirations, while BIS blue reinforces trust and institutional credibility.\n\nTogether, the elements convey a simple idea: 80 years of standards, shaping a future where quality becomes a way of life.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789810421_d0d0168f.png"]},{"id":129460,"date":"19-09-2026 14:58:37","text":"The BIS@80 commemorative logo celebrates eight decades of the Bureau of Indian Standards (1947–2027) and its commitment to quality, safety, reliability and consumer confidence. At the upper centre, the existing BIS logo forms the foundation, while the lower centre has BIS@80 with a bold “80” and a quality-assurance tick, symbolising 80 years of trust. The outermost tricolour ring, crowned by the Ashoka Chakra, represents India’s national identity, unity and growth. Eight blue segments represent the eight decades of BIS and highlight its pillars: Standards, Testing, Certification, Conformity, Consumer Awareness, Safety, Sustainability and Innovation. The outer ring of Warli-style people represents consumers, the citizens who benefit from standards, make informed choices and participate in a quality-conscious society. In the central area, wind turbines, a bridge and city buildings symbolise sustainable development, modern infrastructure and national growth supported by quality standards.","name":"Ritikakalia","dob":"06-10-2003","age":20,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789810104_c5a0e2e8.pdf"]},{"id":129442,"date":"19-09-2026 14:45:33","text":"The BIS@80 logo celebrates eight decades of the Bureau of Indian Standards through a modern, distinctive and institutional visual identity. The interconnected “80” represents continuity, trust, precision and an enduring journey of standards and quality. The official BIS symbol is integrated into the design, preserving its recognizable identity while connecting it with the anniversary theme. Rising bars within the “0” symbolize progress, measurement and continuous improvement. Saffron and green accents reflect India’s identity and nation-building, while the Ashoka Chakra adds a subtle national reference. Bold typography ensures clear recognition, and the design remains effective in both colour and monochrome applications.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789809315_4d851180.jpeg"]},{"id":129435,"date":"19-09-2026 14:40:01","text":"The BIS@80 commemorative logo represents the journey of the Bureau of Indian Standards from establishing trusted standards to shaping a safer, more sustainable and quality-driven India.\n\nThe eight-segment visual structure reflects 80 years of continuous service, while the converging pathways below the BIS symbol represent India's journey from a strong foundation of standards towards a progressive future. The use of blue reflects trust, stability and credibility, while saffron and green add an Indian identity and represent energy, growth and sustainability.","name":"MaheshSolanki","dob":"17-11-1996","age":29,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789808956_e3375966.png"]},{"id":129421,"date":"19-09-2026 14:31:42","text":"BIS@80 – Eight Decades of Trust\nThe “BIS@80 – Eight Decades of Trust” design celebrates the remarkable journey of the Bureau of Indian Standards in promoting quality, safety and reliability in India.\nThe existing BIS identity is retained as an integral part of the design, ensuring continuity and recognition. The bold “80” represents eight decades of service, while its circular and gear-inspired form symbolises standardisation, precision, industry and continuous progress. The Indian tricolour ribbon reflects national pride and BIS’s contribution to the nation’s development.\nThe check mark represents conformity, trust and assurance. The blue colour communicates reliability and professionalism. The words “Quality, Safety, Standards and Consumer Confidence” represent the core values associated with BIS.\nThe design is simple, distinctive and scalable for digital platforms, print, social media, official documents, banners and merchandise. The monochrome version retains clarity and","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789808104_533b54b8.jpeg"]},{"id":129411,"date":"19-09-2026 14:24:30","text":"This logo commemorates 80 years of India’s standards journey and the enduring contribution of BIS to quality, safety, reliability and consumer confidence. The central design integrates the BIS emblem within the number “80”. The maroon “8” represents eight decades of service, while the Ashoka Chakra forms the circular “0”, symbolising India’s national identity, continuity and the nation-building role of standards. The flowing tricolour wave represents India’s progress, unity and development, while its forward movement reflects BIS’s continuing contribution towards a quality-driven and future-ready India. The gold “BIS @80” highlights the significance of this milestone. The tagline “Serving Nation since 1947” represents the continuity of India’s national standards journey from the Indian Standards Institution, established in 1947, to BIS. The overall design combines BIS identity with national symbolism to communicate quality, trust, progress and continuity.","name":"KarthickRaj_49","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789808062_ae463cc9.png"]},{"id":129392,"date":"19-09-2026 14:07:20","text":"This logo commemorates 80 years of India’s standards journey and the enduring contribution of BIS to quality, safety, reliability and consumer confidence. The central design integrates the BIS emblem within the number “80”. The maroon “8” represents eight decades of service, while the Ashoka Chakra forms the circular “0”, symbolising India’s national identity, continuity and the nation-building role of standards. The flowing tricolour wave represents India’s progress, unity and development, while its forward movement reflects BIS’s continuing contribution towards a quality-driven and future-ready India. The gold “BIS @80” highlights the significance of this milestone. The tagline “Serving Nation since 1947” represents the continuity of India’s national standards journey from the Indian Standards Institution, established in 1947, to BIS. The overall design combines BIS identity with national symbolism to communicate quality, trust, progress and continuity.","name":"KarthickRaj_49","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789807005_676061ae.png"]},{"id":129387,"date":"19-09-2026 14:03:29","text":"“8 Decades of Quality – Standards, Safety, Trust”\nThe logo commemorates the 80-year journey of the Bureau of Indian Standards (BIS) and its enduring commitment to quality, safety, reliability and consumer confidence.\nThe prominent “8” represents eight decades of BIS and symbolises continuity and a strong foundation built over the years. The BIS Standard Mark is placed at the centre, highlighting BIS’s role in establishing standards and ensuring quality and safety in everyday life.\nThe surrounding saffron, white and green circular elements represent India and the continuous journey of quality, standardisation and progress. Their circular flow reflects the ongoing commitment of BIS towards building a quality-conscious and self-reliant India.\nThe words “8 DECADES OF QUALITY” highlight the historic milestone, while “BIS@80” gives the celebration a clear and memorable identity.","name":"Divyanshyadav","dob":"15-01-2007","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789806795_19d4d1c6.png"]},{"id":129381,"date":"19-09-2026 13:54:29","text":"The BIS@80 logo represents eight decades of the Bureau of Indian Standards’ contribution towards quality, safety, reliability and consumer confidence. The integrated BIS identity forms the foundation of the design, while the circular elements symbolize continuity, trust and the journey towards a quality-driven India. The number “80” is visually connected with people, industry, safety, sustainability and national progress. The Indian tricolour-inspired flow represents the role of standards in strengthening India’s development and supporting the vision of a Viksit Bharat. The clean and scalable design is intended to remain recognizable across digital platforms, print, official documents, merchandise and public communication.","name":"Kartik","dob":"07-03-2008","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789806256_e2e0ce81.png"]},{"id":129374,"date":"19-09-2026 13:42:16","text":"The BIS@80 mark is designed as a circular seal, echoing the form of a commemorative medal to mark eight decades of national service. At its heart, the numeral \"80\" carries the meaning: the \"8\" is drawn as two interlocking rings, symbolising the unbroken, continuous cycle of testing, standardisation and re-certification that BIS performs; the \"0\" opens into a circular frame holding the existing BIS logo intact, stating visually that BIS itself remains the nucleus around which this milestone is built. Encircling the numerals, an arced band carries the institution's name and its founding promise — Quality, Safety, Trust — in the manner of an official seal or medal, lending the mark gravity and authenticity. A ribbon banner below records 1947–2027, tracing the institution's continuous lineage from the Indian Standards Institution to BIS. The palette of deep teal and antique gold, with a maroon ribbon accent, is drawn from Indian institutional and ceremonial tradition.","name":"Priyanshu","dob":"30-11-2003","age":17,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789805465_53a47311.png"]},{"id":129373,"date":"19-09-2026 13:41:15","text":"Geometric '80': Sharp aur structured lines se bana '80' ek architectural foundation ki tarah dikhta hai, jo desh ke quality standards ko majboot banane ke 80 saal dikhata hai.Shield aur Laurels: Outer frame ek protective shield ki tarah hai aur golden wreaths safety, trust aur 80 saal ki legacy ko celebrate karte hain.Prestige Colors: Deep sapphire blue reliability aur authority ko darshata hai, aur burnished gold is milestone ko ek premium look deta hai.Central Focus: Official BIS logo ko center me secure rakha gaya hai taaki brand identity bilkul clear rahe.","name":"Sarthak Bagoria","dob":"01-04-2009","age":16,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789805432_2675ea82.png"]},{"id":129344,"date":"19-09-2026 13:20:03","text":"प्रस्तावित “BIS@80” लोगो भारतीय मानक ब्यूरो की आठ दशकों की मानकीकरण, गुणवत्ता, सुरक्षा और उपभोक्ता विश्वास की यात्रा को आधुनिक एवं प्रेरणादायक रूप में प्रस्तुत करता है। लोगो में BIS के मूल प्रतीक को केंद्र में रखते हुए उसकी पहचान और विश्वसनीयता को बरकरार रखा गया है।\n“80” के साथ प्रयुक्त गतिशील तिरंगा स्वरूप भारत की प्रगति, निरंतरता और भविष्य की ओर बढ़ते कदमों का प्रतीक है। भारत का मानचित्र BIS की राष्ट्रव्यापी भूमिका तथा “एक भारत–गुणवत्तापूर्ण भारत” की भावना को दर्शाता है। ऊपर की ओर बढ़ता हुआ तीर विकास, नवाचार और ‘विकसित भारत’ की दिशा में निरंतर प्रगति का प्रतीक है।\nलोगो में Quality, Standards, Safety, Reliability और Consumer Trust को दर्शाने वाले प्रतीक BIS के प्रमुख मूल्यों को अभिव्यक्त करते हैं। नीचे दिखाई गई आधुनिक अवसंरचना, परिवहन, ऊर्जा और हरित विकास की रूपरेखा यह दर्शाती है कि मजबूत गुणवत्ता-आधारित मानक देश के सतत एवं समावेशी विकास की नींव हैं।\nनीला रंग विश्वसनीयता, स्थिरता और गुणवत्ता, जबकि केसरिया एवं हरा रंग राष्ट्र की ऊर्जा, प्रगति और समृद्धि का प्रतिनिधित्व करते हैं।","name":"Chandrakala Chouhan","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789804192_fe7f4416.jpg"]},{"id":129323,"date":"19-09-2026 13:03:31","text":"Bureau of Indian Standards (BIS) ke 80 saal pure hone ke avsar par yeh ek behad aakarshak, shuddh aur professional 3D commemorative logo design hai. Is design mein '80' number ko royal blue aur metallic silver ke 3D texture ke sath interlock karke banaya gaya hai, jo 80 saal ki vishwasniyata aur gunwatta ko darshata hai. Iske andar official BIS ka triangular certification emblem ekdam spasht (clear) aur bina kisi galti ke set hai. Niche ki taraf diya gaya tiranga (saffron, white, green) wave desh ki pragati ka prateek hai. Iske alawa, 'BUREAU OF INDIAN STANDARDS', 'QUALITY | SAFETY | TRUST' aur 'Towards Viksit Bharat' ke official taglines isko ekdum mukammal, aakarshak aur standard ke mutabik banate hain.\"","name":"Shaikh Ayan Shaikh Rauf","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789803174_8b0fb4a1.png"]},{"id":129320,"date":"19-09-2026 13:02:32","text":"The BIS@80 commemorative logo symbolizes eight decades of India’s journey towards quality, safety, reliability and standardization.\n\nThe central “80” represents the 80th anniversary, while the integrated BIS emblem connects the commemorative identity with the Bureau of Indian Standards. The flowing saffron, white and green elements reflect India’s identity and the nation’s continuous progress. The blue form represents trust, stability and credibility, while the green leaf incorporated into the design represents sustainability and a commitment to a better future.\n\nThe dates “1946–2026” mark eight decades of BIS’s contribution to standardization and quality assurance. The clean geometric construction and limited visual elements are intended to keep the logo distinctive, recognizable and adaptable across official documents, digital platforms, certificates, products and other applications.","name":"Sumanshuchoudhary","dob":"06-04-2007","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789803107_f356af28.png"]},{"id":129318,"date":"19-09-2026 13:02:13","text":"Meaning of each element\nBIS emblem on the left: Keeps the existing BIS identity clearly visible and makes the connection to the Bureau of Indian Standards immediate.\nLarge “80”: The main visual represents 80 years of BIS.\nBlue “80”: Blue conveys trust, stability, reliability and institutional standards.\nSaffron–white–green flowing ribbon: Represents India and gives the anniversary mark a sense of movement and progress.\nUpward arrow
