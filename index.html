nstitution (ISI), established in 1947, to BIS, the National Standards Body of India.\n\nThe BIS mark is the foundation, symbolising standards, assurance and quality. The continuous “8” embodies 80 years of continuity, evolution and public value. Its interwoven blue and gold signify trust and excellence. The adjoining circle represents an expanding quality ecosystem—connecting standards, industry, testing, certification and consumers. Saffron, white and green express India’s identity, progress and national aspirations.\n\n“Quality • Safety • Trust • Consumer Confidence” captures the impact of standards: consistency creates assurance; assurance creates trust.\n\n“For a Viksit Bharat” connects this legacy with the future—safer products, stronger competitiveness, innovation and sustainable development. 1947–2027 marks eight decades of India’s commitment to quality.","name":"Abhijeet Singh","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789709918_203513df.png"]},{"id":128571,"date":"18-09-2026 10:57:37","text":"The BIS@80 logo marks the completion of 80 years of the Bureau of Indian Standards and its contribution towards building a culture of quality in India. The existing BIS logo has been retained as a central element to preserve the identity and trust associated with the organization.\n\nThe number 80 represents eight decades of BIS’s journey. Its flowing form reflects continuity, growth and the organization’s ability to evolve with the changing needs of the country. The use of the Indian tricolour connects the identity with India and represents the country’s continued progress.\n\nThe overall design brings together the ideas of standards, quality, safety and trust, which are closely associated with the work of BIS. The upward movement in the design represents progress towards a stronger and more developed India.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789709219_956cb160.png"]},{"id":128549,"date":"18-09-2026 10:20:43","text":"The BIS@80 logo celebrates eighty years of the Bureau of Indian Standards' commitment to quality, safety, reliability, and consumer confidence. The design integrates the BIS emblem within the number “80,” symbolizing BIS as the foundation of India’s quality infrastructure. The flowing tricolor band represents national progress, unity, and the journey toward Viksit Bharat. The check mark embedded within the “8” signifies conformity, trust, certification, and excellence in standards. The upward movement reflects innovation, industrial growth, and continuous improvement. Simple, memorable, and scalable, the logo highlights BIS’s enduring role in empowering consumers and strengthening India's future through standards.","name":"AkshajSoni_4","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789707020_ccccd415.png"]},{"id":128546,"date":"18-09-2026 10:20:09","text":"The BIS@80 logo stands for the eight decades of trust, quality, safety and standardisation. The central \"80\" symbolise the journey of the Bureau of Indian Standards and its commitment to building confidence in the everyday products and services. The integrated BIS identity represents the strong foundation of Indian standards, while the flowing tricolour element reflect India's progress and aspirations. The surrounding visual elements stand for technology, industry, sustainability, safety and citizens, which connects the innovations to the daily life. The upwards movement of the design is the continuous improvement and BIS contribution towards a quality driven and self-sufficient India. The clean and scalable form is intended to be a recognisable across digital platforms, print, official documents, merchandise and public communication. In overall, the design conveys 80 years of standards, quality, innovation and trust looking boldly into a safer and better future.","name":"Harini","dob":"12-12-2003","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789706990_49159382.png"]},{"id":128535,"date":"18-09-2026 10:10:36","text":"This commemorative logo celebrates eight decades of the Bureau of Indian Standards (BIS) by seamlessly blending precision engineering with national identity. At first glance, an elegant, ribbon-like \"80\" dominates the composition, built with blueprint drafting lines, grid intersections, and geometric arcs that highlight BIS’s commitment to measurement, standardization, and architectural precision. Upon closer inspection, the map of India emerges naturally within the negative space framed between the numbers, symbolizing BIS’s pervasive, behind-the-scenes influence in safeguarding quality across the country. Anchored directly at the heart of the national map sits the official BIS mark, representing the central role standardisation plays in driving safety, quality control, and economic trust nationwide. By harmonizing geometric rigor with a multilayered visual narrative, this concept delivers a clean, authoritative visual identity that works effortlessly for official institutional use wh","name":"AdhyanJain","dob":"21-11-2011","age":14,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789706418_949004e7.png"]},{"id":128534,"date":"18-09-2026 10:08:21","text":"Yahan is badle hue poster par ek prerak lekh pesh hai:\n * Viksit Bharat ka Sankalp: Yeh poster 'Viksit Bharat 2047' aur 'Standards Building India' ke mahatvapurna sankalp ko behtareen tarike se pesh karta hai.\n * Aakarshak Badlaav: Isme photo ko ek naya aur alag roop diya gaya hai jisme Hindi text aur QR code ko shamil kiya gaya hai.\n * Prerana aur Sahbhagita: \"Pragati ka hissa banein, apne vichar sajha karein\" ka sandesh har nagrik ko desh ke vikas mein aage aane ke liye prerit karta hai.\n * Aapki Bhumika: \"Your Role, Nation's Goal. Contribute Now\" ka yah nara hume yaad dilata hai ki desh ki unnati mein hamari har ek koshish ahem hai.\n * Aage Badhein: Aaiye, diye gaye QR code ko scan karein, is rashtriya abhiyan mein participate karein aur ek sashakt evam viksit Bharat ke nirman mein apna mahatvapurna yogdan dein.","name":"AbhaySinghSolanki","dob":"27-03-2007","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789706296_719e2dcb.png"]},{"id":128530,"date":"18-09-2026 09:55:26","text":"**BIS@80 लोगो** भारतीय मानक ब्यूरो की आठ दशकों की गौरवशाली यात्रा, गुणवत्ता के प्रति अटूट प्रतिबद्धता तथा मानकीकरण के माध्यम से राष्ट्र के विकास में उसके सतत योगदान का सशक्त दृश्य-प्रतिरूप है। शैलीकृत **“80”** इसकी केंद्रीय अवधारणा है, जहाँ “8” के भीतर उर्ध्वमुखी तीर निरंतर प्रगति, दूरदृष्टि और नवाचार की गतिशीलता को अभिव्यक्त करता है। “0” में समाहित **अशोक चक्र** भारतीय अस्मिता, मूल्यों और राष्ट्रीय गौरव का प्रतीक है, जबकि ट्रस्ट सील गुणवत्ता, विश्वसनीयता और उपभोक्ता विश्वास की दृढ़ नींव को दर्शाती है।\n\n**मौजूदा BIS लोगो** को रचना के केंद्र में अभिन्न रूप से पिरोया गया है, जो संस्था की समृद्ध विरासत, पहचान और निरंतरता का प्रतीक बनता है। सूक्ष्म **स्केल मार्क्स एवं ग्रिड लाइन्स** सटीकता, अनुशासन और मानकीकरण के वैज्ञानिक दृष्टिकोण को रेखांकित करती हैं। **केसरिया, सफेद और हरा** रंग क्रमशः राष्ट्रीय गौरव, पारदर्शिता एवं सतत प्रगति की भावना को उभारते हैं।\n\nसमग्र रूप से यह लोगो परंपरा और आधुनिकता का संतुलित संगम है—**सरल, विशिष्ट, स्मरणीय और कालातीत**।","name":"ramsingh_2513","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789705521_b6c5b1cf.png"]},{"id":128529,"date":"18-09-2026 09:51:45","text":"BIS@80 लोगो भारतीय मानक ब्यूरो की 80 वर्षों की गौरवपूर्ण यात्रा, गुणवत्ता के प्रति प्रतिबद्धता और मानकीकरण के महत्व को दर्शाता है। शैलीकृत \"80\" इसका केंद्रीय तत्व है, जिसमें \"8\" के भीतर एक ऊर्ध्वगामी तीर निरंतर विकास और नवाचार को दर्शाता है, तथा \"0\" के भीतर अशोक चक्र और एक ट्रस्ट सील विश्वसनीयता और उपभोक्ता विश्वास का प्रतीक है।\n\nमौजूदा BIS लोगो को डिज़ाइन के हृदय में अभिन्न रूप से शामिल किया गया है, जो संस्था की विरासत और निरंतरता को दर्शाता है। डिज़ाइन में मानकीकरण के प्रतीक के रूप में सूक्ष्म स्केल मार्क्स और ग्रिड लाइन्स जोड़ी गई हैं, जो BIS के मानकीकरण मिशन को दर्शाती हैं।\n\nतिरंगे के रंग — केसरिया, सफेद और हरा — राष्ट्रीय गौरव, पवित्रता और सतत विकास का प्रतीक हैं। यह डिज़ाइन सरल, आधुनिक, विशिष्ट और आसानी से पहचाने जाने योग्य है। यह रंगीन और मोनोक्रोम दोनों रूपों में स्पष्ट है तथा डिजिटल, प्रिंट, सोशल मीडिया, बैनर और मर्चेंडाइज़ पर समान रूप से प्रभावी है।","name":"digeshkumar_45","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789705076_813c261f.png"]},{"id":128526,"date":"18-09-2026 09:42:10","text":"The BIS@80 commemorative logo celebrates eight decades of the Bureau of Indian Standards as India’s National Standards Body and its enduring contribution to quality, safety, reliability and consumer confidence.\n\nThe design integrates the existing BIS identity with the number “80”, symbolising 80 years of commitment to standardisation, testing, conformity assessment and quality assurance. The flowing circular forms represent continuity, consistency and trust, while the forward-moving visual element reflects progress and India’s journey towards a quality-driven Viksit Bharat.\n\nThe integration of the BIS identity within the “80” represents BIS’s enduring presence in everyday life and its role in building confidence in products, services and processes. The clean and distinctive visual language is suitable for digital and print applications, including official documents, publications, banners, social media and merchandise, while retaining clarity in monochrome.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789704722_01a04b77.png"]},{"id":128522,"date":"18-09-2026 09:34:25","text":"The BIS@80 logo celebrates eighty years of the Bureau of Indian Standards' commitment to quality, safety, reliability, and consumer confidence. The design integrates the BIS emblem within the number “80,” symbolizing BIS as the foundation of India’s quality infrastructure. The flowing tricolor band represents national progress, unity, and the journey toward Viksit Bharat. The check mark embedded within the “8” signifies conformity, trust, certification, and excellence in standards. The upward movement reflects innovation, industrial growth, and continuous improvement. Simple, memorable, and scalable, the logo highlights BIS’s enduring role in empowering consumers and strengthening India's future through standards.","name":"Dharmendra Vaddoriya","dob":"09-04-1995","age":25,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789704360_19ea0e67.jpg"]},{"id":128501,"date":"18-09-2026 08:34:41","text":"The BIS@80 identity celebrates eight decades of building trust through standards. The number “80” is constructed as a precise geometric framework, symbolising consistency, measurement, reliability and the structured foundation that standards provide for quality and progress. The existing BIS logo remains an integral and recognisable part of the identity, preserving BIS’s established visual language. The official BIS blue, red and white palette ensures continuity with the institution’s identity. The clean, scalable geometry is designed to work across digital platforms, print, official documents, certificates, signage, banners and merchandise. The identity connects BIS’s legacy with the future of India’s quality infrastructure and the journey towards a Viksit Bharat.","name":"SriKrishnataak","dob":"29-11-2003","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789700634_6170fd4d.png"]},{"id":128472,"date":"18-09-2026 01:05:57","text":"The BIS@80 logo represents eight decades of the Bureau of Indian Standards’ commitment to quality, safety, reliability and consumer confidence. The interwoven “80” symbolises continuity, progress and the strong foundation built by BIS over the years. The blue and gold elements represent trust, excellence and a milestone achievement, while the Indian tricolour accents reflect the organisation’s contribution to the nation. The BIS emblem integrated within the “0” establishes the identity of the National Standards Body. The gear symbolises standardisation, testing and conformity assessment, while the green leaf represents sustainable development and responsible growth. Together, these elements communicate BIS’s role in empowering citizens, promoting quality in everyday life and contributing to a stronger and Viksit Bharat through standards.","name":"Khushi Kushwaha","dob":"12-05-2003","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789673687_e74bbaa6.png"]},{"id":128462,"date":"18-09-2026 00:25:02","text":"The BIS@80 logo celebrates 80 years of the Bureau of Indian Standards and its enduring commitment to quality, safety, reliability and consumer confidence.\n\nThe existing BIS emblem is placed at the centre as the foundation of the design, representing the organisation’s trusted role in establishing and maintaining standards. The bold “80” symbolises eight decades of service, progress and nation-building. Its flowing form represents continuity, growth and BIS’s journey towards a safer and better future.\nThe Ashoka Chakra and the tricolour-inspired elements reflect India’s national identity, unity and progress. The circular design symbolises trust, continuity and the connection between standards, industry, consumers and everyday life.\nThe rising sun represents hope, innovation and a brighter future, while the blue colour conveys trust, reliability and quality. Together, these elements express BIS’s contribution to a quality-driven and resilient India.","name":"vinayak kumar","dob":"28-02-2003","age":22,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789671280_9450717d.png"]},{"id":128458,"date":"18-09-2026 00:01:36","text":"The BIS@80 logo represents the remarkable journey of the Bureau of Indian Standards (BIS) over 80 years of promoting quality, safety, reliability, and standardisation in India.\nThe number “80” is the central element of the design, symbolising eight decades of trust and excellence. The design incorporates the BIS identity and elements of Indian heritage, reflecting the organisation’s strong connection with India and its people.\nThe circular form represents unity, continuity, and completeness, while the upward-flowing elements symbolise India’s progress towards a safer, stronger, and quality-driven future. The use of clean and balanced lines reflects precision, consistency, and standardisation, which are the core principles of BIS.\nThe logo is designed to be simple, memorable, and modern while respecting the legacy of BIS. It celebrates 80 years of quality and trust and looks forward to a future where standards continue to contribute to innovation, consumer protection.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789669739_305f7b9f.png"]},{"id":128456,"date":"17-09-2026 23:58:33","text":"The BIS@80 logo symbolises 80 years of trust, quality and standards. The bold “80” represents BIS’s remarkable journey, while the Indian tricolour elements reflect the organisation’s contribution to the nation. The BIS emblem and surrounding symbols represent quality, safety, sustainability, reliability and consumer confidence. The flowing design connects the past, present and a safer tomorrow, highlighting BIS’s continuing role in building a quality-conscious and progressive India.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789669702_cca27f4f.png"]},{"id":128449,"date":"17-09-2026 23:45:22","text":"This logo celebrates 80 years of BIS and its journey alongside India.\n\n* The BIS logo carries a proud legacy.\n* The 80 reflects eight decades of trust and service.\n* The flowing form tells a story of a journey that continues.\n* The Ashoka Chakra brings the spirit of India.\n* The tricolour reflects pride, unity and hope.\n* The forward movement looks towards a brighter tomorrow.\n* At its heart, it celebrates people, trust and a better life.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/File_13.jpeg"]},{"id":128441,"date":"17-09-2026 23:15:48","text":"The BIS@80 logo celebrates eight decades of the Bureau of Indian Standards and its continued commitment to quality, safety, reliability and consumer confidence. The BIS emblem is integrated with the number “80” to create a unified identity. The flowing blue and red elements represent continuity, progress and trust, while the circular form symbolises completeness and eight decades of service. The design reflects BIS’s role in standardization, testing and conformity assessment, helping consumers make informed choices and ensuring quality in everyday life. The clean and scalable visual language is intended to work effectively across digital platforms, print, official documents, social media and merchandise. The overall concept presents BIS as a strong foundation for quality infrastructure and a Viksit Bharat.","name":"ManviJi","dob":"23-09-2009","age":16,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789667119_e32109fd.png"]},{"id":128424,"date":"17-09-2026 22:23:14","text":"The BIS@80 logo commemorates 80 years of the Bureau of Indian Standards (1947-2027) and its contribution to nation-building through quality, safety, and trust. The number 80 symbolizes BIS's enduring legacy, with the BIS emblem representing reliability and public confidence. The circular seal highlights BIS's core functions: Standardization, Testing, Certification, Conformity Assessment, and Consumer Awareness, while the green check mark signifies quality and compliance. India's map, modern infrastructure, innovation, renewable energy, and industry reflect national progress. The tricolour arrow symbolizes growth toward Viksit Bharat, reinforcing the vision of \"Better Standards, Better Choices, Better Lives.\"","name":"ISHAN","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789663862_41c4d9f6.png"]},{"id":128421,"date":"17-09-2026 22:18:50","text":"The BIS@80 logo celebrates 80 years of the Bureau of Indian Standards, symbolizing quality, safety, reliability, and progress. The official BIS emblem at the centre represents the organization’s identity and commitment to standardization. The bold “80” highlights eight decades of achievements and continuous development. Saffron and green watercolor strokes reflect India’s unity, growth, and prosperity, while the Ashoka Chakra represents national pride and progress. The surrounding hand-painted symbols of science, industry, infrastructure, safety, and sustainability showcase BIS’s contribution to building a quality-conscious and developed India. The watercolor style adds a creative, human touch to the design.","name":"MusarafHussain","dob":"15-11-2004","age":21,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789663705_ca7051da.png"]},{"id":128405,"date":"17-09-2026 21:54:01","text":"BIS@80: Eight Decades, One Standard\nThe BIS@80 logo is built around the number 80, representing eight decades of service, continuity and progress. The flowing form of the numeral reflects BIS’s journey with a clear focus on standards and national development.\nThe official BIS emblem is preserved in its original form and placed within the “0”, connecting the institution’s established identity with its 80th anniversary.\nThe use of BIS blue represents trust, reliability and authority, while red marks the importance of this milestone and the journey ahead.\nThe simple geometric form keeps the identity clear, distinctive and suitable for official documents, publications, digital platforms, signage and commemorative material.\nEight decades of standards. One enduring commitment to the nation.","name":"Nitin Paliwal","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789662061_0f50f4e0.png"]},{"id":128394,"date":"17-09-2026 21:41:24","text":"This symbol celebration 80 year safety and quality standard Trust to 1947/2027 bis@80 logo","name":"SayedFaizanQuamar","dob":"28-02-2008","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789661177_6b405226.jpg"]},{"id":128390,"date":"17-09-2026 21:28:16","text":"Considering this logo shows how the Bureau of Indian Standards (BIS) celebrates their 8 decades of journey of commitment to promoting quality, standards, safety, reliability, and consumer confidence, enhance standards and a better future. The logo is clear ,simple, creative, distinctive, meaningful.visual identity of this logo- representing how standardization, testing, conformity assessment, and consumer awareness empower citizens, enable informed choices.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789660658_c6af198a.png"]},{"id":128382,"date":"17-09-2026 21:16:05","text":"Central \"80\" Design: Integrates the map of India inside the '8' and the official BIS Standard Mark inside the '0'.\n\nMain Slogan: \"Empowering Quality, Building Viksit Bharat\" along the upper arch.\n\nTimeline: Marks \"1947 – 2027\" for the 80th Foundation Day milestone.\n\nFuture Target: Highlights \"Viksit Bharat @ 2047\" to align with India's centenary goals.\n\nLeft Icons: Gears, microscope, and beaker to represent industrial testing and science.\n\nRight Icons: Bullet train, wind turbines, and factories to show modern infrastructure and green energy.\n\nBase Illustration: Figures of everyday citizens to symbolize public trust and consumer safety.","name":"Tausif Raza","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789659952_2ae10060.png"]},{"id":128379,"date":"17-09-2026 21:13:54","text":"BIS@80 logo reflected with safer customer, quality product, progress of india economy.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789659698_06e66355.jpg"]},{"id":128378,"date":"17-09-2026 21:04:56","text":"The BIS@80 Commemorative Logo visually captures the eight-decade journey of the Bureau of Indian Standards in promoting quality, standards, safety, reliability, and consumer confidence.\nThe design seamlessly incorporates the official BIS logo as an integral anchor within a modern, geometric numerical '80' structure styled in India's national tricolour palette. Deep blue represents institutional trust and authority, while energetic saffron and steadfast green accent lines symbolize dynamic growth, sustainability, and a forward-looking vision.\nTogether, these elements reflect BIS’s core mission—standardization, testing, conformity assessment, and consumer awareness—empowering citizens and laying a robust quality infrastructure for a Viksit Bharat. Clean, balanced, and highly scalable, the emblem ensures clear visual communication across all digital, print, and official media platforms.","name":"MedhaDixit","dob":"15-10-2006","age":17,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789659272_45bc5209.png"]},{"id":128373,"date":"17-09-2026 20:57:28","text":"The BIS@80 logo celebrates 80 years of the Bureau of Indian Standards and its enduring commitment to quality, safety, reliability and consumer confidence. The existing BIS emblem is placed at the centre as the foundation of the design, representing the organisation’s trusted role in establishing and maintaining standards.\nThe bold “80” symbolises eight decades of service and progress, while its flowing form represents continuity, growth and BIS’s journey towards the future. The Ashoka Chakra within the design reflects India’s national identity and the contribution of strong standards to nation-building.\nThe saffron, white, green and blue elements represent India, integrity, progress and trust. The surrounding curves symbolise the connection between standards, industry, consumers and everyday life.","name":"MeghaprabhaMukherjee","dob":"26-12-2006","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789658941_2e7acea9.png"]},{"id":128371,"date":"17-09-2026 20:54:29","text":"My logo celebrates BIS@80 by creatively combining the official BIS identity with a dynamic representation of the number “80”, symbolising eight decades of commitment to quality, safety, reliability and trust. The flowing form of the design represents continuity and the evolving journey of BIS from 1946 to 2026. The blue element reflects trust, stability and strong standards, while the saffron and green accents represent India, progress and national development. The circular movement conveys unity and a continuous commitment to improving quality standards. The upward elements symbolise growth, innovation and a forward-looking approach. Together, these elements represent BIS’s enduring contribution to building confidence among consumers and supporting quality-driven development. The overall design reflects the vision of a safer, stronger and quality-conscious India while marking 80 years of BIS’s journey.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789658661_3ef01198.png"]},{"id":128362,"date":"17-09-2026 20:33:51","text":"The Bureau of Indian Standards (BIS), the National Standards Body of India, in collaboration with MyGov, invites citizens to participate in the BIS@80 Commemorative Logo Design Competition as part of the celebrations marking its 80th Foundation Day on 6 January 2027.","name":"Yash","dob":"07-01-2007","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789657360_60b31352.jpg"]},{"id":128274,"date":"17-09-2026 17:46:47","text":"यह BIS@80 लोगो भारतीय मानक ब्यूरो की 80 वर्षों की गौरवपूर्ण यात्रा, गुणवत्ता, सुरक्षा, विश्वसनीयता और उपभोक्ता विश्वास को दर्शाता है। लोगो में BIS का मूल चिन्ह इसकी पहचान और मानकीकरण के प्रति प्रतिबद्धता का प्रतीक है। इसके साथ उभरता हुआ “80” BIS की आठ दशकों की निरंतर सेवा और उपलब्धियों को दर्शाता है।\n“8” के भीतर बने शील्ड, परीक्षण फ्लास्क, गियर और मानव आकृतियाँ क्रमशः सुरक्षा, परीक्षण एवं गुणवत्ता, औद्योगिक विकास तथा नागरिकों और उपभोक्ताओं की भागीदारी का प्रतिनिधित्व करती हैं। “0” के भीतर बना भारत का मानचित्र देशव्यापी गुणवत्ता संस्कृति और BIS की राष्ट्रीय भूमिका को दर्शाता है। इसके चारों ओर बने केसरिया और हरे रंग के घुमावदार आकार भारत की प्रगति, ऊर्जा, विकास और राष्ट्र निर्माण की भावना को अभिव्यक्त करते हैं।\nऊपर दिखाई गई मानव आकृतियाँ कौशल, नवाचार और सामूहिक भागीदारी का प्रतीक हैं। नीचे लिखे “Quality • Safety • Trust” BIS के मूल उद्देश्यों को सरल रूप में प्रस्तुत करते हैं। पूरा डिजाइन हाथ से बनाए गए रंगों और रेखाओं की शैली में तैयार किया गया है,","name":"Ashish Kumar Shukla","dob":"21-08-1997","age":21,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789647350_5be33571.png"]},{"id":128265,"date":"17-09-2026 17:33:56","text":"This logo celebrates BIS@80, marking 80 years of the Bureau of Indian Standards (BIS) and its contribution to quality and standardisation in India. The familiar BIS symbol at the top represents the organisation’s established identity and commitment to standards. This logo admitted the truth, trust and greatness of india.","name":"Abhishek","dob":"19-08-2006","age":15,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1789646554_88ac6ba4.jpg"]}]</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const MAXF = 5, MAXC = 6;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isPdf = u => /\.pdf(\?|$)/i.test(u);
const fname = u => u.split('/').pop();

D.forEach(d => {
  const m = d.date.match(/(\d+)-(\d+)-(\d+)\s+(\d+):(\d+):(\d+)/);
  d.ts = m ? Date.UTC(+m[3], m[2]-1, +m[1], +m[4], +m[5], +m[6]) : 0;
  d.ageN = typeof d.age === 'number' ? d.age : null;
  d.pdf = d.urls.some(isPdf);
  d.cover = d.urls.find(u => !isPdf(u)) || d.urls[0];
  d.hay = (d.name + ' ' + d.id + ' ' + d.text).toLowerCase();
  d.when = m ? `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}` : d.date;
});
const byId = new Map(D.map(d => [d.id, d]));

/* ---------- saved decisions (this browser only) ---------- */
const KEY = 'bis80-final5:v1';
let S = { status:{}, final:[], notes:{}, cmp:[] };
function load(){ try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v) S = sanitize(v); } catch(e){} }
function sanitize(v){
  const out = { status:{}, final:[], notes:{}, cmp:[] };
  for (const [k, s] of Object.entries(v.status || {})) if (byId.has(+k) && (s === 'short' || s === 'out')) out.status[k] = s;
  out.final = (v.final || []).map(Number).filter(id => byId.has(id)).filter((x, i, a) => a.indexOf(x) === i).slice(0, MAXF);
  for (const [k, n] of Object.entries(v.notes || {})) if (byId.has(+k) && String(n).trim()) out.notes[k] = String(n);
  out.cmp = (v.cmp || []).map(Number).filter(id => byId.has(id)).slice(0, MAXC);
  return out;
}
let saveT; function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }, 150); }
const pref = { get(k, f){ try { const v = localStorage.getItem('bis80-pref:' + k); return v === null ? f : JSON.parse(v); } catch(e){ return f; } },
               set(k, v){ try { localStorage.setItem('bis80-pref:' + k, JSON.stringify(v)); } catch(e){} } };

const statusOf = id => S.final.includes(id) ? 'final' : (S.status[id] || 'todo');
const rankOf = id => S.final.indexOf(id) + 1;

/* ---------- decisions ---------- */
function setShort(id, force){
  const cur = S.status[id];
  const on = force !== undefined ? force : cur !== 'short';
  if (on) S.status[id] = 'short'; else if (cur === 'short') delete S.status[id];
  if (!on && S.final.includes(id)) S.final = S.final.filter(x => x !== id);
  changed(id);
  return on;
}
function setOut(id){
  const on = S.status[id] !== 'out';
  if (on) { S.status[id] = 'out'; S.final = S.final.filter(x => x !== id); }
  else delete S.status[id];
  changed(id);
  return on;
}
function toggleFinal(id){
  if (S.final.includes(id)) { S.final = S.final.filter(x => x !== id); changed(id); toast(`Removed from final 5`); return; }
  if (S.final.length >= MAXF) { toast(`Your final 5 is full. Remove one first.`); return; }
  S.final.push(id); S.status[id] = 'short';
  changed(id); toast(`Added to final 5 at #${S.final.length}`);
}
function moveFinal(id, dir){
  const i = S.final.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= S.final.length) return;
  [S.final[i], S.final[j]] = [S.final[j], S.final[i]];
  save(); renderRail(); S.final.forEach(refreshCard); if (!$('#board').hidden) renderBoard();
}
function toggleCmp(id){
  const i = S.cmp.indexOf(id);
  if (i >= 0) S.cmp.splice(i, 1);
  else { if (S.cmp.length >= MAXC) { toast(`You can compare up to ${MAXC} at once.`); return; } S.cmp.push(id); }
  save(); refreshCard(id); renderRail(); if (!$('#board').hidden && boardMode === 'cmp') renderBoard();
}
function changed(id){
  save(); refreshCard(id); renderRail(); renderProgress();
  if (!$('#board').hidden) renderBoard();
  if (!$('#lb').hidden) renderLb();
}

/* ---------- media ---------- */
function media(u, alt){
  if (!u) return `<div class="ph">No file</div>`;
  if (isPdf(u)) return `<div class="ph"><span class="big">PDF</span><a href="${esc(u)}" target="_blank" rel="noopener">Open PDF ↗</a></div>`;
  return `<img src="${esc(u)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" data-src="${esc(u)}">`;
}
document.addEventListener('error', e => {
  const t = e.target;
  if (t.tagName === 'IMG' && t.dataset.src && !t.dataset.failed) {
    t.dataset.failed = 1;
    const ph = document.createElement('div'); ph.className = 'ph';
    ph.innerHTML = `Image didn't load<a href="${esc(t.dataset.src)}" target="_blank" rel="noopener">Open link ↗</a>`;
    t.replaceWith(ph);
  }
}, true);

/* ---------- progress ---------- */
function renderProgress(){
  let short = 0, out = 0;
  for (const d of D) { const s = statusOf(d.id); if (s === 'short') short++; else if (s === 'out') out++; }
  const fin = S.final.length, done = short + out + fin, n = D.length;
  const pct = x => (100 * x / n).toFixed(2) + '%';
  $('#pbar').innerHTML = `<span class="p-final" style="width:${pct(fin)}"></span><span class="p-short" style="width:${pct(short)}"></span><span class="p-out" style="width:${pct(out)}"></span>`;
  $('#plegend').innerHTML =
    `<span>Reviewed <b>${done}</b> / ${n}</span>` +
    `<span><i class="dot" style="background:var(--accent)"></i>Final <b>${fin}</b>/5</span>` +
    `<span><i class="dot" style="background:var(--star)"></i>Shortlisted <b>${short}</b></span>` +
    `<span><i class="dot" style="background:var(--out);opacity:.6"></i>Set aside <b>${out}</b></span>`;
}

/* ---------- grid ---------- */
let view = [];
function apply(){
  const terms = $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const f = $('#filt').value, s = $('#sort').value;
  view = D.filter(d => {
    const st = statusOf(d.id);
    if (f === 'running' && st === 'out') return false;
    if (f === 'todo' && st !== 'todo') return false;
    if (f === 'short' && st !== 'short' && st !== 'final') return false;
    if (f === 'final' && st !== 'final') return false;
    if (f === 'out' && st !== 'out') return false;
    if (f === 'notes' && !S.notes[d.id]) return false;
    return terms.every(t => d.hay.includes(t));
  });
  const ageCmp = dir => (a, b) => (a.ageN === null) - (b.ageN === null) || dir * ((a.ageN ?? 0) - (b.ageN ?? 0));
  const cmp = {
    'date-desc': (a, b) => b.ts - a.ts, 'date-asc': (a, b) => a.ts - b.ts,
    'name': (a, b) => a.name.localeCompare(b.name, 'en', {sensitivity:'base'}),
    'id': (a, b) => a.id - b.id, 'age-asc': ageCmp(1), 'age-desc': ageCmp(-1)
  }[s];
  view.sort(cmp);
  if (f === 'final') view.sort((a, b) => rankOf(a.id) - rankOf(b.id));
  $('#count').textContent = `${view.length} shown`;
  $('#grid').innerHTML = view.length ? view.map(card).join('') : `<div class="empty">${emptyMsg(f)}</div>`;
}
function emptyMsg(f){
  return ({ todo:'You have reviewed every entry here.', short:'Nothing shortlisted yet. Use ☆ Shortlist on the entries you like.',
    final:'Your final 5 is empty. Use "Add to final" on a shortlisted entry.', out:'Nothing set aside yet.',
    notes:'No notes yet. Open an entry to write one.' })[f] || 'No entries match. Clear the search or change the filter.';
}
function card(d){
  const st = statusOf(d.id), id = d.id, inCmp = S.cmp.includes(id);
  const b = [];
  if (st === 'final') b.push(`<span class="badge b-final">FINAL #${rankOf(id)}</span>`);
  else if (st === 'short') b.push(`<span class="badge b-short">★ SHORTLIST</span>`);
  else if (st === 'out') b.push(`<span class="badge b-out">SET ASIDE</span>`);
  if (d.urls.length > 1) b.push(`<span class="badge">${d.urls.length} FILES</span>`);
  if (d.pdf) b.push(`<span class="badge">PDF</span>`);
  if (S.notes[id]) b.push(`<span class="badge b-note">✎ NOTE</span>`);
  const finFull = S.final.length >= MAXF && st !== 'final';
  return `<article class="card st-${st}${inCmp ? ' cmp-on' : ''}" data-id="${id}">
    <button class="thumb" data-act="open" data-id="${id}" aria-label="Open entry ${id}">${media(d.cover, 'Logo by ' + d.name)}<span class="badges">${b.join('')}</span></button>
    <div class="info">
      <div class="name">${esc(d.name || 'Unnamed')}</div>
      <div class="meta">#${id} · ${d.ageN !== null ? d.ageN + ' yrs' : 'age —'} · ${esc(d.when)}</div>
      <div class="snip">${esc(d.text)}</div>
      <div class="actions">
        <button class="btn a-short" data-act="short" data-id="${id}" aria-pressed="${st === 'short' || st === 'final'}">${st === 'short' || st === 'final' ? '★ Shortlisted' : '☆ Shortlist'}</button>
        <button class="btn a-out" data-act="out" data-id="${id}" aria-pressed="${st === 'out'}">${st === 'out' ? '↺ Bring back' : '✕ Set aside'}</button>
        <button class="btn a-final" data-act="final" data-id="${id}" aria-pressed="${st === 'final'}" ${finFull ? 'disabled title="Final 5 is full"' : ''}>${st === 'final' ? `✓ Final #${rankOf(id)}` : '+ Add to final'}</button>
        <button class="btn a-cmp" data-act="cmp" data-id="${id}" aria-pressed="${inCmp}">${inCmp ? '✓ Comparing' : '⇄ Compare'}</button>
      </div>
    </div></article>`;
}
function refreshCard(id){
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (el) el.outerHTML = card(byId.get(id));
}
function refreshAllFinalButtons(){ document.querySelectorAll('.card').forEach(el => { const id = +el.dataset.id; el.outerHTML = card(byId.get(id)); }); }

/* ---------- final 5 rail ---------- */
let lastFull = null;
function renderRail(){
  const slots = [];
  for (let i = 0; i < MAXF; i++) {
    const id = S.final[i];
    if (id) { const d = byId.get(id);
      slots.push(`<div class="slot filled" title="${esc(d.name)} · #${id}"><span class="rk">${i+1}</span>
        <button class="im" data-act="zoomfinal" data-id="${id}" aria-label="Open ${esc(d.name)}">${isPdf(d.cover) ? '<div class="ph" style="font-size:9px;padding:2px">PDF</div>' : `<img src="${esc(d.cover)}" alt="" referrerpolicy="no-referrer">`}</button>
        <span class="nm">${esc(d.name)}</span></div>`);
    } else slots.push(`<div class="slot"><span class="rk" style="opacity:.35">${i+1}</span><span class="empty-t">Empty</span></div>`);
  }
  $('#slots').innerHTML = slots.join('');
  const n = S.final.length;
  $('#railSub').textContent = n === MAXF ? 'All 5 chosen' : `${MAXF - n} still to pick`;
  $('#cmpN').textContent = S.cmp.length ? `(${S.cmp.length})` : '';
  $('#cmpBtn').disabled = S.cmp.length < 2;
  $('#viewFinal').disabled = n === 0;
  const full = n >= MAXF;
  if (lastFull !== null && full !== lastFull) refreshAllFinalButtons();
  lastFull = full;
}

/* ---------- compare / final board ---------- */
let boardMode = 'cmp'; const colFile = {};
function openBoard(mode){ boardMode = mode; if (boardIds().length === 0) return; $('#board').hidden = false; document.body.style.overflow = 'hidden'; renderBoard(); }
function closeBoard(){ $('#board').hidden = true; document.body.style.overflow = ''; }
const boardIds = () => boardMode === 'final' ? S.final.slice() : S.cmp.slice();
function decideButtons(id){
  const st = statusOf(id), finFull = S.final.length >= MAXF && st !== 'final';
  return `<div class="decide">
    <button class="btn a-short" data-act="short" data-id="${id}" aria-pressed="${st === 'short' || st === 'final'}">${st === 'short' || st === 'final' ? '★ Shortlisted' : '☆ Shortlist'}</button>
    <button class="btn a-out" data-act="out" data-id="${id}" aria-pressed="${st === 'out'}">${st === 'out' ? '↺ Bring back' : '✕ Set aside'}</button>
    <button class="btn a-final" data-act="final" data-id="${id}" aria-pressed="${st === 'final'}" ${finFull ? 'disabled title="Final 5 is full"' : ''}>${st === 'final' ? `✓ Final #${rankOf(id)}` : '+ Final'}</button>
  </div>`;
}
function renderBoard(){
  const ids = boardIds();
  if (!ids.length) { closeBoard(); return; }
  const showSizes = $('#sizeBtn').getAttribute('aria-pressed') === 'true';
  $('#boardTitle').textContent = boardMode === 'final' ? `Your final ${ids.length}` : `Comparing ${ids.length}`;
  $('#clearCmp').hidden = boardMode !== 'cmp';
  $('#cols').innerHTML = ids.map((id, idx) => {
    const d = byId.get(id), fi = colFile[id] || 0, u = d.urls[fi] || d.urls[0], st = statusOf(id), rk = rankOf(id);
    const files = d.urls.length > 1 ? `<div class="files">${d.urls.map((x, j) => `<button data-act="file" data-id="${id}" data-j="${j}" aria-pressed="${j === fi}">File ${j+1}${isPdf(x) ? ' · PDF' : ''}</button>`).join('')}</div>` : '';
    const sizes = showSizes && !isPdf(u) ? `<div class="sizes">${[96, 48, 32, 16].map(px => `<figure><img src="${esc(u)}" alt="" width="${px}" height="${px}" referrerpolicy="no-referrer"><figcaption>${px}px</figcaption></figure>`).join('')}</div>` : '';
    const order = boardMode === 'final' ? `<div class="order">
        <button class="btn" data-act="up" data-id="${id}" ${idx === 0 ? 'disabled' : ''} aria-label="Move up in ranking">◀ Rank higher</button>
        <button class="btn" data-act="down" data-id="${id}" ${idx === ids.length - 1 ? 'disabled' : ''} aria-label="Move down in ranking">Rank lower ▶</button></div>` : '';
    return `<div class="col${st === 'final' ? ' st-final' : ''}">
      <div class="stage">${isPdf(u) ? media(u, '') : `<img src="${esc(u)}" alt="Logo by ${esc(d.name)}" referrerpolicy="no-referrer" data-src="${esc(u)}" data-act="zoomboard" data-id="${id}">`}${rk ? `<span class="rkbig">#${rk}</span>` : ''}</div>
      ${sizes}${files}
      <div class="col-body">
        <div class="ttl"><div class="name" style="font-size:16px">${esc(d.name || 'Unnamed')}</div>
          ${boardMode === 'cmp' ? `<button class="btn" data-act="cmp" data-id="${id}" title="Remove from comparison">Remove</button>` : ''}</div>
        ${order}
        ${decideButtons(id)}
        <dl class="kv">
          <dt>Entry ID</dt><dd>${id}</dd><dt>Submitted</dt><dd>${esc(d.date)}</dd>
          <dt>DOB</dt><dd>${esc(d.dob || '—')}</dd><dt>Age</dt><dd>${d.ageN !== null ? d.ageN : '—'}</dd>
        </dl>
        <label class="note-l" for="note-b-${id}">My note</label>
        <textarea class="note" id="note-b-${id}" data-note="${id}" placeholder="Why this one, concerns, etc.">${esc(S.notes[id] || '')}</textarea>
        <div class="desc">${esc(d.text)}</div>
        <div class="links">${d.urls.map(x => `<a href="${esc(x)}" target="_blank" rel="noopener">${esc(fname(x))} ↗</a>`).join('')}</div>
      </div></div>`;
  }).join('');
}

/* ---------- review lightbox ---------- */
let lbList = [], lbIdx = 0, lbFile = 0;
function openLb(list, i){ if (!list.length) return; lbList = list; lbIdx = Math.max(0, i); lbFile = 0; $('#lb').hidden = false; document.body.style.overflow = 'hidden'; renderLb(); $('#lbClose').focus(); }
function closeLb(){ $('#lb').hidden = true; if ($('#board').hidden) document.body.style.overflow = ''; }
function renderLb(){
  const d = lbList[lbIdx], id = d.id, u = d.urls[lbFile] || d.urls[0], st = statusOf(id), inCmp = S.cmp.includes(id);
  $('#lbPos').textContent = `${lbIdx + 1} / ${lbList.length}`;
  $('#lbPrev').hidden = $('#lbNext').hidden = lbList.length < 2;
  $('#lbImg').innerHTML = isPdf(u) ? `<div class="ph"><span class="big">PDF</span><a href="${esc(u)}" target="_blank" rel="noopener">Open PDF in a new tab ↗</a></div>` : `<img src="${esc(u)}" alt="Logo by ${esc(d.name)}" referrerpolicy="no-referrer" data-src="${esc(u)}">`;
  const stLabel = { final:`In your final 5 at #${rankOf(id)}`, short:'Shortlisted', out:'Set aside', todo:'Not reviewed yet' }[st];
  const noteFocused = document.activeElement && document.activeElement.id === 'note-lb';
  if (noteFocused) return; // don't wipe the note while typing
  $('#lbSide').innerHTML = `
    <div class="name" style="font-size:20px">${esc(d.name || 'Unnamed')}</div>
    <div class="meta">${stLabel}</div>
    ${decideButtons(id)}
    <button class="btn a-cmp" data-act="cmp" data-id="${id}" aria-pressed="${inCmp}" style="justify-self:start;align-self:flex-start">${inCmp ? '✓ Comparing' : '⇄ Add to compare'}</button>
    <div class="keys"><span><kbd>S</kbd> shortlist &amp; next</span><span><kbd>X</kbd> set aside &amp; next</span><span><kbd>F</kbd> final 5</span><span><kbd>←</kbd><kbd>→</kbd> move</span><span><kbd>Esc</kbd> close</span></div>
    <dl class="kv"><dt>Entry ID</dt><dd>${id}</dd><dt>Submitted</dt><dd>${esc(d.date)}</dd><dt>DOB</dt><dd>${esc(d.dob || '—')}</dd><dt>Age</dt><dd>${d.ageN !== null ? d.ageN : '—'}</dd></dl>
    ${d.urls.length > 1 ? `<div class="files">${d.urls.map((x, j) => `<button data-act="lbfile" data-j="${j}" aria-pressed="${j === lbFile}">File ${j+1}${isPdf(x) ? ' · PDF' : ''}</button>`).join('')}</div>` : ''}
    <label class="note-l" for="note-lb">My note</label>
    <textarea class="note" id="note-lb" data-note="${id}" placeholder="Why this one, concerns, etc.">${esc(S.notes[id] || '')}</textarea>
    <div class="desc">${esc(d.text)}</div>
    <div class="links">${d.urls.map(x => `<a href="${esc(x)}" target="_blank" rel="noopener">${esc(fname(x))} ↗</a>`).join('')}</div>`;
}
function stepLb(n){ if (lbList.length < 2) return; lbIdx = (lbIdx + n + lbList.length) % lbList.length; lbFile = 0; renderLb(); }

/* ---------- export / backup ---------- */
function finalText(){
  if (!S.final.length) return 'No entries chosen yet.';
  return 'BIS@80 logo – final 5\n\n' + S.final.map((id, i) => {
    const d = byId.get(id);
    return `${i+1}. ${d.name} (Entry ${id}, submitted ${d.date}${d.ageN !== null ? ', age ' + d.ageN : ''})\n   ${d.urls.join('\n   ')}` + (S.notes[id] ? `\n   Note: ${S.notes[id].replace(/\n/g, ' ')}` : '');
  }).join('\n\n');
}
function csv(){
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Rank','Status','Entry ID','Name','Submitted','DOB','Age','File links','My note','Description']];
  const order = [...S.final, ...D.filter(d => statusOf(d.id) === 'short').map(d => d.id)];
  order.forEach(id => { const d = byId.get(id), st = statusOf(id);
    rows.push([st === 'final' ? rankOf(id) : '', st === 'final' ? 'Final 5' : 'Shortlisted', id, d.name, d.date, d.dob, d.ageN ?? '', d.urls.join(' '), S.notes[id] || '', d.text]); });
  return '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
}
function download(name, text, type){
  try {
    const url = URL.createObjectURL(new Blob([text], {type}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    toast(`Saved ${name} to your downloads`);
  } catch(e){ toast('Your browser blocked the download. Copy the text instead.'); }
}
function stamp(){ const t = new Date(); return t.toISOString().slice(0, 10); }
function showModal(html){ $('#mBox').innerHTML = html; $('#modal').hidden = false; const f = $('#mBox').querySelector('button,textarea'); f && f.focus(); }
function closeModal(){ $('#modal').hidden = true; }
function exportModal(){
  showModal(`<h3 id="mTitle">Export your choices</h3>
    <p>The text lists your final 5 in rank order with links and notes. The spreadsheet adds your full shortlist and opens in Excel.</p>
    <textarea id="exportText" readonly>${esc(finalText())}</textarea>
    <div class="row">
      <button class="btn big" data-act="closemodal">Close</button>
      <button class="btn big" data-act="dlcsv">Download spreadsheet (.csv)</button>
      <button class="btn big primary" data-act="copytext">Copy text</button>
    </div>`);
}
async function copyText(){
  const ta = $('#exportText');
  try { await navigator.clipboard.writeText(ta.value); toast('Copied'); }
  catch(e){ ta.focus(); ta.select(); toast('Press Ctrl+C (or ⌘C) to copy the selected text'); }
}
function resetModal(){
  showModal(`<h3 id="mTitle">Start over?</h3>
    <p>This clears every shortlist, set-aside, note and your final 5 in this browser. Back up first if you might want them again.</p>
    <div class="row"><button class="btn big" data-act="closemodal">Keep my decisions</button><button class="btn big" data-act="backup">Back up first</button><button class="btn big primary" data-act="doreset" style="background:var(--out);border-color:var(--out);color:#fff">Clear everything</button></div>`);
}

/* ---------- toast ---------- */
let toastT; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

/* ---------- prefs ---------- */
function setTile(t){ document.body.dataset.tile = t; document.querySelectorAll('.seg [data-tile]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tile === t)); pref.set('tile', t); }
function setMono(on){ document.body.classList.toggle('mono', on); ['#monoBtn', '#monoBtn2'].forEach(s => $(s).setAttribute('aria-pressed', on)); pref.set('mono', on); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act], [data-tile]'); if (!t) return;
  if (t.dataset.tile) return setTile(t.dataset.tile);
  const id = +t.dataset.id, a = t.dataset.act;
  const inLb = !!t.closest('#lb');
  switch (a) {
    case 'open': return openLb(view, view.findIndex(d => d.id === id));
    case 'short': { const on = setShort(id); toast(on ? 'Shortlisted' : 'Removed from shortlist'); return; }
    case 'out': { const on = setOut(id); toast(on ? 'Set aside' : 'Back in the running'); return; }
    case 'final': return toggleFinal(id);
    case 'cmp': toggleCmp(id); if (inLb) renderLb(); return;
    case 'up': return moveFinal(id, -1);
    case 'down': return moveFinal(id, 1);
    case 'file': colFile[id] = +t.dataset.j; return renderBoard();
    case 'lbfile': lbFile = +t.dataset.j; return renderLb();
    case 'zoomfinal': { const list = S.final.map(x => byId.get(x)); return openLb(list, S.final.indexOf(id)); }
    case 'zoomboard': { const ids = boardIds(); return openLb(ids.map(x => byId.get(x)), ids.indexOf(id)); }
    case 'closemodal': return closeModal();
    case 'copytext': return copyText();
    case 'dlcsv': return download(`BIS80-final-5-${stamp()}.csv`, csv(), 'text/csv;charset=utf-8');
    case 'backup': return download(`BIS80-decisions-backup-${stamp()}.json`, JSON.stringify({app:'bis80-final5', saved:new Date().toISOString(), ...S}, null, 1), 'application/json');
    case 'doreset': S = { status:{}, final:[], notes:{}, cmp:[] }; save(); closeModal(); renderAll(); toast('Cleared'); return;
  }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.note) return;
  const id = t.dataset.note, v = t.value;
  if (v.trim()) S.notes[id] = v; else delete S.notes[id];
  save();
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (el) { const has = !!S.notes[id], badge = el.querySelector('.b-note');
    if (has && !badge) el.querySelector('.badges').insertAdjacentHTML('beforeend', '<span class="badge b-note">✎ NOTE</span>');
    if (!has && badge) badge.remove(); }
});
$('#monoBtn').onclick = $('#monoBtn2').onclick = () => setMono(!document.body.classList.contains('mono'));
$('#sizeBtn').onclick = () => { const b = $('#sizeBtn'); b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); renderBoard(); };
$('#cmpBtn').onclick = () => openBoard('cmp');
$('#viewFinal').onclick = () => openBoard('final');
$('#exportBtn').onclick = exportModal;
$('#closeBoard').onclick = closeBoard;
$('#clearCmp').onclick = () => { const old = S.cmp; S.cmp = []; save(); old.forEach(refreshCard); renderRail(); closeBoard(); };
$('#reviewBtn').onclick = () => { if (!view.length) return toast('No entries to review with this filter.'); openLb(view.slice(), 0); };
$('#lbClose').onclick = closeLb;
$('#lbPrev').onclick = () => stepLb(-1);
$('#lbNext').onclick = () => stepLb(1);
$('#lb').addEventListener('click', e => { if (e.target.classList.contains('lb-stage')) closeLb(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#backupBtn').onclick = () => download(`BIS80-decisions-backup-${stamp()}.json`, JSON.stringify({app:'bis80-final5', saved:new Date().toISOString(), ...S}, null, 1), 'application/json');
$('#restoreBtn').onclick = () => $('#restoreFile').click();
$('#restoreFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { S = sanitize(JSON.parse(r.result)); save(); renderAll(); toast('Backup restored'); } catch(err){ toast("That file isn't a backup from this page."); } e.target.value = ''; };
  r.readAsText(f);
};
$('#resetBtn').onclick = resetModal;
let qT; $('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(apply, 120); });
$('#sort').onchange = () => { pref.set('sort', $('#sort').value); apply(); };
$('#filt').onchange = () => { pref.set('filt', $('#filt').value); apply(); };
document.addEventListener('keydown', e => {
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { if (e.key === 'Escape') e.target.blur(); return; }
  if (!$('#lb').hidden) {
    const id = lbList[lbIdx].id, k = e.key.toLowerCase();
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowLeft') stepLb(-1);
    else if (e.key === 'ArrowRight') stepLb(1);
    else if (k === 's') { setShort(id, true); toast('Shortlisted'); stepLb(1); }
    else if (k === 'x') { if (S.status[id] !== 'out') setOut(id); toast('Set aside'); stepLb(1); }
    else if (k === 'f') toggleFinal(id);
    else return;
    e.preventDefault();
  } else if (!$('#board').hidden && e.key === 'Escape') closeBoard();
});

function renderAll(){ apply(); renderRail(); renderProgress(); if (!$('#board').hidden) renderBoard(); }

load();
setTile(pref.get('tile', 'light'));
setMono(pref.get('mono', false));
$('#sort').value = pref.get('sort', 'date-desc');
$('#filt').value = pref.get('filt', 'running');
renderAll();
})();
</script>
</body>
</html>
