<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIS@80 Final Five</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: progress header, sticky filter bar, contact-sheet grid; a fixed "Final 5" rail at the bottom; overlays for review and compare. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#151a26; --muted:#5d6475; --line:#dde0e8;
  --accent:#1d4fb8; --accent-ink:#ffffff; --accent-soft:#e3eafa;
  --star:#b87400; --star-soft:#fbf0dc; --out:#9a3b3b; --out-soft:#f6e6e6; --gold:#1d4fb8;
  --tile-light:#ffffff; --tile-grey:#c9ccd3; --tile-dark:#1b1e25;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10131a; --surface:#181c25; --ink:#e7e9ef; --muted:#9aa1b2; --line:#2a303d;
  --accent:#7ea2f2; --accent-ink:#0d1220; --accent-soft:#1e2943;
  --star:#f2b13a; --star-soft:#3a2e15; --out:#e08a8a; --out-soft:#3a1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131a; --surface:#181c25; --ink:#e7e9ef; --muted:#9aa1b2; --line:#2a303d;
  --accent:#7ea2f2; --accent-ink:#0d1220; --accent-soft:#1e2943;
  --star:#f2b13a; --star-soft:#3a2e15; --out:#e08a8a; --out-soft:#3a1f22; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{padding-block:20px 12px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.top h1{font:700 clamp(22px,3vw,30px)/1.1 var(--display);margin:0;letter-spacing:-.01em}
.top .sub{color:var(--muted);margin-top:6px;font-size:13px;max-width:70ch}
.progress{min-width:min(100%,360px);flex:0 1 420px}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.pbar span{display:block;height:100%}
.pbar .p-final{background:var(--accent)}.pbar .p-short{background:var(--star)}.pbar .p-out{background:var(--out);opacity:.6}
.plegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.plegend b{color:var(--ink);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12px;text-decoration:underline;text-underline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.bar-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 10px;height:36px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field select,.field input{border:0;background:transparent;height:34px;outline:none;min-width:0}
.field.search{flex:1 1 220px}.field.search input{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;height:36px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.chip{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 12px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.count{margin-left:auto;font:12px var(--mono);color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-block:16px 170px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative}
.card.st-short{border-color:var(--star);box-shadow:0 0 0 1px var(--star)}
.card.st-final{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card.st-out .thumb,.card.st-out .info>*:not(.actions){opacity:.42}
.card.cmp-on{outline:2px dashed var(--accent);outline-offset:-2px}
.thumb{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--tile);cursor:zoom-in;border:0;padding:0;width:100%;display:block}
.thumb img{width:100%;height:100%;object-fit:contain;padding:10px;display:block}
.badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font:500 10px/1 var(--mono);background:rgba(20,24,34,.78);color:#fff;padding:4px 6px;border-radius:4px;letter-spacing:.03em}
.badge.b-final{background:var(--accent);color:var(--accent-ink)}
.badge.b-short{background:var(--star);color:#fff}
.badge.b-out{background:var(--out);color:#fff}
.badge.b-note{background:rgba(20,24,34,.78)}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font:600 14px/1.25 var(--display);overflow-wrap:anywhere}
.meta{font:11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.snip{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto;padding-top:8px}
.btn{height:30px;border:1px solid var(--line);background:transparent;border-radius:5px;padding:0 10px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.a-short[aria-pressed="true"]{background:var(--star-soft);color:var(--star);border-color:var(--star);font-weight:600}
.btn.a-out[aria-pressed="true"]{background:var(--out-soft);color:var(--out);border-color:var(--out);font-weight:600}
.btn.a-final[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.a-cmp[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.big{height:36px;padding:0 14px}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font:12px var(--mono);text-align:center;padding:12px}
.ph .big{font:700 22px var(--display);color:var(--ink);opacity:.7}
.ph a{color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

body[data-tile="light"]{--tile:var(--tile-light)}
body[data-tile="grey"]{--tile:var(--tile-grey)}
body[data-tile="dark"]{--tile:var(--tile-dark)}
body[data-tile="dark"] .ph{color:#aab}
body[data-tile="dark"] .ph .big{color:#eee}
body.mono .thumb img,body.mono .stage img,body.mono .sizes img,body.mono .slot img,body.mono .lb-stage img{filter:grayscale(1)}

/* final five rail */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.rail-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rail h2{font:700 15px var(--display);margin:0;white-space:nowrap}
.rail h2 small{display:block;font:11px var(--mono);color:var(--muted);font-weight:400}
.slots{display:flex;gap:8px;flex:1 1 auto;min-width:0;overflow-x:auto;padding-bottom:2px}
.slot{flex:none;width:118px;border:1px dashed var(--line);border-radius:6px;display:flex;gap:6px;align-items:center;padding:4px;min-height:58px;background:var(--bg)}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--surface)}
.slot .rk{font:700 18px var(--display);color:var(--accent);width:16px;text-align:center;flex:none}
.slot .im{width:48px;height:48px;border-radius:4px;background:var(--tile);flex:none;overflow:hidden;cursor:zoom-in;border:0;padding:0}
.slot .im img{width:100%;height:100%;object-fit:contain;padding:2px;display:block}
.slot .nm{font-size:11px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0}
.slot .empty-t{font:11px var(--mono);color:var(--muted)}
.rail .acts{display:flex;gap:6px;flex-wrap:wrap}
.cmpnote{font:12px var(--mono);color:var(--muted)}

/* compare board */
.board{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.board-head{border-bottom:1px solid var(--line);padding-block:10px;background:var(--bg)}
.board-head h2{font:700 18px var(--display);margin:0 8px 0 0}
.cols{flex:1;overflow:auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:14px;padding-block:14px 24px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.col.st-final{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.stage{aspect-ratio:1/1;max-width:100%;background:var(--tile);position:relative}
.stage img{width:100%;height:100%;object-fit:contain;padding:16px;display:block;cursor:zoom-in}
.stage .rkbig{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--display);border-radius:5px;padding:2px 9px}
.files{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
.files button{font:11px var(--mono);border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 7px;cursor:pointer}
.files button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.sizes{display:flex;gap:14px;align-items:flex-end;padding:10px 12px;background:var(--tile);border-top:1px solid var(--line)}
.sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.sizes img{object-fit:contain;display:block}
.sizes figcaption{font:10px var(--mono);color:var(--muted)}
body[data-tile="dark"] .sizes figcaption{color:#aab}
.col-body{padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
.col-body .ttl{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.decide{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px}
.order{display:flex;gap:6px;flex-wrap:wrap}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12px}
dl.kv dt{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.07em;padding-top:2px}
dl.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.desc{font-size:13px;line-height:1.6;white-space:pre-line;max-width:65ch}
.links{font:11px var(--mono);display:flex;flex-direction:column;gap:2px}
.links a{color:var(--accent);overflow-wrap:anywhere}
.note{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px;font-size:13px}
.note-l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* review lightbox */
.lb{position:fixed;inset:0;z-index:70;background:rgba(8,10,14,.92);display:grid;grid-template-columns:1fr minmax(0,400px);color:#e8eaf0}
.lb-stage{position:relative;display:flex;align-items:center;justify-content:center;padding:56px 56px 24px;min-width:0;min-height:0}
.lb-stage .tilebox{width:100%;height:100%;background:var(--tile);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;padding:20px}
.lb-side{background:var(--surface);color:var(--ink);overflow:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;border:0;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
.lb .nav:hover{background:rgba(255,255,255,.22)}
.lb .prev{left:max(8px,env(safe-area-inset-left,0px))}.lb .next{right:8px}
.lb .close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:6px;height:34px;padding:0 12px;cursor:pointer}
.lb .pos{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;font:12px var(--mono);color:#aab}
.lb .files{padding:0}
.keys{font:11px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.keys kbd{font:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--ink)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:90;background:rgba(8,10,14,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border-radius:10px;max-width:520px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.modal-box h3{font:700 18px var(--display);margin:0}
.modal-box p{margin:0;color:var(--muted);font-size:13px}
.modal-box textarea{width:100%;min-height:200px;font:12px/1.5 var(--mono);border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:10px}
.modal-box .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:100;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}

@media (max-width:760px){
  .lb{grid-template-columns:1fr;grid-template-rows:50vh 1fr}
  .lb-stage{padding:52px 48px 12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding-bottom:230px}
  .count{margin-left:0;width:100%}
  .bar{position:static}
  .slot{width:96px}.slot .nm{display:none}
}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s,border-color .15s}}
</style>
</head>
<body data-tile="light">

<header class="top wrap">
  <div>
    <h1>BIS@80 Logo Entries · Final Five</h1>
    <div class="sub">Go through the entries, shortlist the strong ones and set aside the rest. Compare the shortlist side by side, then pick and rank your final 5 in the bar at the bottom.</div>
  </div>
  <div class="progress">
    <div class="pbar" id="pbar"></div>
    <div class="plegend" id="plegend"></div>
    <div class="tools">
      <button class="linkbtn" id="backupBtn">Back up my decisions</button>
      <span class="cmpnote">·</span>
      <button class="linkbtn" id="restoreBtn">Restore a backup</button>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
      <span class="cmpnote">·</span>
      <button class="linkbtn" id="resetBtn">Start over</button>
    </div>
  </div>
</header>

<div class="bar wrap">
  <div class="bar-in">
    <div class="field search"><label for="q">Search</label><input id="q" type="search" placeholder="Name, entry ID or words in the description"></div>
    <div class="field"><label for="filt">Show</label>
      <select id="filt">
        <option value="running">Still in the running</option>
        <option value="todo">Not reviewed yet</option>
        <option value="short">Shortlisted</option>
        <option value="final">Final 5</option>
        <option value="out">Set aside</option>
        <option value="notes">With my notes</option>
        <option value="all">Everything</option>
      </select></div>
    <div class="field"><label for="sort">Sort</label>
      <select id="sort">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="name">Name A–Z</option>
        <option value="id">Entry ID</option>
        <option value="age-asc">Age, youngest</option>
        <option value="age-desc">Age, oldest</option>
      </select></div>
    <div class="seg" role="group" aria-label="Logo background">
      <button data-tile="light" aria-pressed="true" title="White background"><span class="sw" style="background:var(--tile-light)"></span>White</button>
      <button data-tile="grey" aria-pressed="false" title="Grey background"><span class="sw" style="background:var(--tile-grey)"></span>Grey</button>
      <button data-tile="dark" aria-pressed="false" title="Dark background"><span class="sw" style="background:var(--tile-dark)"></span>Dark</button>
    </div>
    <button class="chip" id="monoBtn" aria-pressed="false" title="Check how each logo holds up in black and white">Monochrome</button>
    <button class="chip" id="reviewBtn" title="Step through the entries shown, one at a time, with keyboard shortcuts">▶ Review one by one</button>
    <span class="count" id="count"></span>
  </div>
</div>

<main class="wrap"><div class="grid" id="grid"></div></main>

<div class="rail wrap" id="rail">
  <div class="rail-in">
    <h2>Final 5<small id="railSub"></small></h2>
    <div class="slots" id="slots"></div>
    <div class="acts">
      <button class="btn big" id="cmpBtn" title="Compare the entries you ticked with ⇄ Compare">⇄ Compare <span id="cmpN"></span></button>
      <button class="btn big primary" id="viewFinal">View final 5</button>
      <button class="btn big" id="exportBtn">Export</button>
    </div>
  </div>
</div>

<section class="board" id="board" hidden aria-label="Compare entries">
  <div class="board-head wrap">
    <div class="bar-in">
      <button class="btn big" id="closeBoard">← Back to all entries</button>
      <h2 id="boardTitle"></h2>
      <div class="seg" role="group" aria-label="Logo background">
        <button data-tile="light" aria-pressed="true"><span class="sw" style="background:var(--tile-light)"></span>White</button>
        <button data-tile="grey" aria-pressed="false"><span class="sw" style="background:var(--tile-grey)"></span>Grey</button>
        <button data-tile="dark" aria-pressed="false"><span class="sw" style="background:var(--tile-dark)"></span>Dark</button>
      </div>
      <button class="chip" id="monoBtn2" aria-pressed="false">Monochrome</button>
      <button class="chip" id="sizeBtn" aria-pressed="true" title="Preview each logo at favicon and letterhead sizes">Small-size test</button>
      <button class="btn big" id="clearCmp">Clear compare list</button>
    </div>
  </div>
  <div class="cols wrap" id="cols"></div>
</section>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Entry detail">
  <div class="lb-stage">
    <button class="close" id="lbClose">✕ Close</button>
    <span class="pos" id="lbPos"></span>
    <button class="nav prev" id="lbPrev" aria-label="Previous entry">‹</button>
    <div class="tilebox" id="lbImg"></div>
    <button class="nav next" id="lbNext" aria-label="Next entry">›</button>
  </div>
  <aside class="lb-side" id="lbSide"></aside>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal-box" id="mBox"></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script id="data" type="application/json">[{"id":132053,"date":"22-09-2026 16:41:19","text":"The BIS@80 commemorative logo celebrates 80 years of BIS’s journey in promoting quality, safety, reliability, standardisation, and consumer confidence. The existing BIS emblem is integrated into the “80”, symbolising the organisation’s enduring commitment to quality and national development.\n\nThe dynamic tricolour-inspired curves represent India’s progress, unity, innovation, and national pride, while the green leaf signifies sustainability, growth, and a greener, brighter future. Together, these elements reflect how strong standards and quality infrastructure empower citizens, support informed choices, and contribute to a Viksit Bharat.\n\nThe design is simple, distinctive, meaningful, scalable, and versatile, ensuring clear recognition across digital and print media, official documents, social media, banners, merchandise, and both colour and monochrome applications.","name":"Nitesh Shankar Lad","dob":"27-06-1988","age":35,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790075454_793c3250.png"]},{"id":132050,"date":"22-09-2026 16:38:56","text":"The BIS@80 logo celebrates 80 years of the Bureau of Indian Standards (BIS) and its contribution towards quality, safety and trust in India.\nThe existing BIS logo is an important part of the design. It represents the strong identity and long history of BIS. The number 80 highlights the completion of eight decades of service.\nThe design uses BIS blue along with the colours of the Indian national flag – saffron, white and green. These colours represent India, while the flowing design shows progress, growth and the journey of BIS towards a better and stronger future.\nThe simple and clean design makes the logo easy to recognise and use in different sizes. It can be used on official documents, websites, social media, banners, advertisements, merchandise and other communication materials.\nOverall, the BIS@80 logo represents 80 years of trust, quality and service, while looking forward to continued progress and excellence in the future.","name":"vinay kumar","dob":"01-03-1982","age":44,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790075288_f1dca60e.png"]},{"id":132042,"date":"22-09-2026 16:33:06","text":"The BIS@80 identity transforms the number 80 into a visual journey of quality and national progress. The continuous 8 represents eight decades of BIS's commitment to standardisation and excellence, while the 0 evolves into a quality seal symbolising verification, reliability and consumer confidence. The integrated checkmark represents conformity and trust, while the flowing Indian tricolour introduces the nation's identity and signifies India's forward journey. The upward movement and foundational geometry represent the role of strong quality infrastructure in building a Viksit Bharat. Together, the elements communicate that BIS's 80-year journey is not merely a celebration of the past, but a foundation for India's quality-driven future.\nAnd with one line, I want to end my presentation on BIS@80 is,“From setting standards to shaping India's future.”\nThankyou","name":"KhushiSingh","dob":"26-02-2006","age":20,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790074799_cc9e9156.png","https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790074788_d112b0fa.png"]},{"id":132041,"date":"22-09-2026 16:32:09","text":"The BIS@80 logo celebrates eight decades of India’s journey towards Quality, Safety, Reliability and Consumer Confidence. At the centre, the BIS emblem represents the strong foundation built through Standardization, Testing, Conformity Assessment and Consumer Awareness.\n\nThe integrated “80” symbolises eight decades of service, while its continuous form represents continuity, trust and an unwavering commitment to quality. The surrounding visual elements reflect Testing, Safety, Industry, Consumers, Standards and Sustainability—showing how BIS touches everyday life and empowers citizens to make informed choices.\n\nThe upward movement and Indian tricolour-inspired flow represent progress, innovation and the collective journey towards a Viksit Bharat. The design brings together BIS’s rich legacy and its forward-looking vision, making Quality an integral part of India’s growth and development.","name":"AKHILESH KUMAR","dob":"15-07-1997","age":29,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790074924_d8adda65.png"]},{"id":132036,"date":"22-09-2026 16:29:29","text":"This BIS@80 commemorative logo celebrates eight decades of the Bureau of Indian Standards as a symbol of quality, safety, reliability and trust. The iconic BIS symbol forms the visual foundation, representing the authority of Indian standards, while the flowing tricolour “80” marks the eight-decade journey and reflects India’s unity, growth and continuous progress. Indian heritage is woven into the design through motifs inspired by architecture, nature, science, technology and traditional craftsmanship. The surrounding elements represent the diverse areas where standards touch everyday life—from consumer products and infrastructure to scientific innovation and sustainable development. The family and modern cityscape within the emblem symbolize how BIS standards protect citizens and contribute to a stronger, safer and more confident India. The sweeping tricolour ribbon signifies a journey from trusted foundations toward a progressive future. The message “मानक से समृद्ध भारत”","name":"Tanishabisht","dob":"01-01-2006","age":17,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790074796_97057271.jpeg"]},{"id":132035,"date":"22-09-2026 16:29:17","text":"The BIS@80 logo celebrates eight decades of BIS’s unwavering commitment to quality, safety, reliability and standardization in India.\nThe existing BIS emblem forms the foundation of the design, symbolizing trust and the strong quality infrastructure built over the years. The bold “80” represents eight decades of excellence and continuity, while the Indian tricolour-inspired flowing ribbon signifies progress, unity and BIS’s contribution towards a Viksit Bharat.\nThe India map integrated within the “0” represents the nationwide reach and impact of BIS. The surrounding symbols of safety, quality, testing, industry and consumers reflect the diverse dimensions of BIS’s work and its role in empowering citizens to make informed choices.\n Overall, the design represents BIS’s journey from establishing standards to making quality an integral part of everyday life.","name":"Priyadarshi RITESH","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790074680_cfb9acc1.png"]},{"id":132031,"date":"22-09-2026 16:24:06","text":"The BIS@80 commemorative logo celebrates eight decades of the Bureau of Indian Standards' commitment to quality, safety, reliability, and consumer confidence in India. The official BIS logo is seamlessly integrated into the numeral \"8\", symbolizing BIS's enduring legacy and continuous pursuit of excellence. The numeral \"0\" is presented as a quality assurance seal with a bold check mark, representing certification, conformity assessment, testing, and trust. The Ashoka Chakra signifies national progress and BIS's contribution to nation-building. The tricolour sweep reflects India's growth journey and the vision of Viksit Bharat. Icons within the circular band depict BIS's core functions, including testing, standardization, consumer protection, and industrial development. The skyline portrays India's transformation through quality-led infrastructure, innovation, manufacturing, and sustainable development. Together, these elements position BIS as the foundation of India's quality ecosystem","name":"Harsh Sen","dob":"24-08-2002","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790074423_f0a22a86.pdf"]},{"id":132020,"date":"22-09-2026 16:14:52","text":"The commemorative logo design created for the BIS@80 Commemorative Logo Design Competition serves as a visually striking emblem that captures the legacy, mission, and future vision of the Bureau of Indian Standards (BIS) as it prepares to mark its 80th Foundation Day on 6 January 2027. The design skillfully blends technical parameter requirements with symbolic storytelling, ensuring that the essence of quality, standardization, consumer trust, and national progress is communicated effectively across digital and print mediums.\nStructure, Geometry, and Color Palette\nThe logo adopts a classic circular crest format, a timeless design choice that conveys completeness, integrity, unity, and continuous evolution. The circular border creates a clean enclosure, making the logo highly scalable, balanced, and adaptable for various applications—ranging from official government documents and certificates to social media banners, website headers, and commemorative merchandise such as pin or coin","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790073742_d02df6ea.png"]},{"id":132017,"date":"22-09-2026 16:12:39","text":"The BIS@80 logo marks 80 years of service. It uses the number “8,” made up of eight connected parts. Each part stands for one of BIS’s main roles: standards, quality, safety, reliability, testing, conformity assessment, consumer awareness, and national development. Together, they show how BIS builds a complete system where standards, testing, and awareness all work hand in hand.\n\nThe BIS symbol sits at the center, showing its role as India’s National Standards Body. Next to it, the circular “0” stands for continuity and the ongoing growth of standards.\n\nThe design is simple and clear, with familiar BIS colours that build trust. It works well in both colour and black‑and‑white.\n\nIn short, BIS@80 is not just about a number. It’s about 80 years of safer products, reliable services, informed consumers, and a quality‑driven Viksit Bharat.","name":"BalajiPraveenE","dob":"10-01-2003","age":20,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790073659_84ae682a.png"]},{"id":132015,"date":"22-09-2026 16:08:44","text":"Design Key Highlights:\n\n    Infinity-Inspired '8':\n\n        Digit '8' ko infinity symbol ka roop diya gaya hai, jo BIS ke nirantar commitment, reliability, aur adrig vishwas ko darshata hai.\n\n        Iske andar subtle golden gear / cogwheel elements integrate kiye gaye hain, jo Bharat ke industrial growth aur standardisation process ka prateek hain.\n\n    ISI Mark Integrated '0':\n\n        Digit '0' ke centre mein official IS / BIS Standard Mark ko beautifully placement di gayi hai, jo quality control aur consumer protection ko highlight karta hai.\n\n    Golden Jubilee Ribbon:\n\n        Number 80 ke neeche diya gaya dynamic golden ribbon logo ko ek premium aur milestone-celebration look deta hai.\n\n    Colors & Typography:\n\n        Deep Royal Blue: Trust, authority, aur national standard body ki identity ko signify karta hai.\n\n        Metallic Gold: 80 saal ki safalta aur excellence ko darshata hai.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790073514_4bf13d45.png"]},{"id":132005,"date":"22-09-2026 15:59:53","text":"The BIS@80 [The Bureau of Indian Standards ] is a symbol of quality, safety, reliability and consumer confidence .the existing BIS logo forms the central identity of design, ensuring continuity between BIS's heritage and its future . overall the logo represents 80 years of trusted standards and building confidence for today and a better tomorrow","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790072983_ba9cdd80.jpeg"]},{"id":131993,"date":"22-09-2026 15:39:07","text":"BIS@80 is not just a celebration of a number; it represents eight decades of building trust through quality and standards. The design brings the familiar BIS identity together with a bold “80”, making the milestone feel like a natural extension of the organisation itself.\nThe movement of the design reflects a journey—from the foundations laid over the past 80 years towards a future driven by innovation, safety and progress. The saffron, white and green elements connect this journey with the spirit of India and the vision of Viksit Bharat.🪷\nI have kept the visual language simple and memorable because a strong logo should communicate its idea quickly, without needing explanation. The design is intended to work equally well across official documents, digital platforms, signage and other applications, while representing BIS’s continuing role in shaping a culture of quality, reliability and confidence in India.🇮🇳","name":"ShubhalaxmiJena","dob":"20-05-2006","age":20,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790071709_f38ebd4c.png"]},{"id":131986,"date":"22-09-2026 15:31:29","text":"> *Title: Manak - Har Ghar, Har Cheez Par*\n>\n> My BIS@80 logo is a hand-drawn tribute to 80 years of BIS.\n>\n> *Number 8:* Upper circle is the *Ashok Chakra* - symbol of nation and 24x7 duty. Lower circle shows *mini icons of daily products* (bottle, toy, etc.) - showing BIS protects every product we touch. The tricolor base shows these products now meet standards for a Viksit Bharat.\n>\n> *Number 0:* Contains Logo of BIS this logo also use your idea means in your logo upper triange protect Red means a person but now it protect all india like a mother is protecting her child","name":"Anshikasingh","dob":"19-04-2012","age":13,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790070993_909ac1fd.jpeg"]},{"id":131985,"date":"22-09-2026 15:31:26","text":"यह लोगो BIS की 80 वर्षों की गौरवपूर्ण यात्रा, गुणवत्ता और उपभोक्ता विश्वास को एक आधुनिक रूप में प्रस्तुत करता है। BIS का प्रतीक इसकी मजबूत विरासत को दर्शाता है, जबकि तिरंगे की गतिशील रेखाएँ भारत की प्रगति, एकता और ‘विकसित भारत’ की ओर बढ़ते कदमों का प्रतीक हैं। ‘80’ का स्वरूप निरंतर विकास, नवाचार और बेहतर गुणवत्ता के प्रति BIS की प्रतिबद्धता को दर्शाता है।","name":"Abhishek Kumar","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790071281_298d560a.png"]},{"id":131984,"date":"22-09-2026 15:30:43","text":"BIS@80 – “80 Years of Standards, Trust and Progress”\n\nThe logo celebrates the 80-year journey of BIS from 1947 to 2027, symbolising its enduring contribution to quality, safety, trust and nation building.\n\nThe dynamic “80” represents continuity, progress and a forward-looking India, while the integrated BIS emblem signifies standardisation, authenticity and public confidence.\n\nThe green leaves, renewable-energy elements and cityscape reflect sustainability, innovation and India’s transformation towards a prosperous future. The saffron, white and green bands represent national identity and the journey towards a stronger and safer nation.\n\n“Standards for a Viksit Bharat” highlights the role of standards in quality-driven national development, while “Quality | Safety | Trust” reflects the core values of BIS.\n\nThe design is created for clarity, recognition and versatility, with effective usability in colour and monochrome formats at 300 DPI.","name":"Pooja","dob":"18-11-1987","age":38,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790071234_86090898.jpeg"]},{"id":131980,"date":"22-09-2026 15:26:34","text":"Concept Note – BIS@80\nThe BIS@80 logo celebrates eight decades of trust, quality, safety and reliability. The iconic BIS symbol represents a strong foundation of standardization and national confidence, while “80” marks eight decades of institutional excellence. The Indian tricolour elements reflect national pride, unity and progress. The shield and check mark symbolize safety and consumer protection; the flask represents scientific testing and innovation; the certificate signifies conformity assessment and credibility; and the people icon represents consumer awareness and empowerment. The flowing tricolour bands lead towards the map of India and “Viksit Bharat,” symbolizing BIS’s vision of a quality-driven, innovative and globally competitive India.","name":"SWARNIM CHAURASIA","dob":"20-03-2007","age":14,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790070216_b1a5b07b.png"]},{"id":131975,"date":"22-09-2026 15:13:01","text":"The BIS@80 logo marks 80 years of the Bureau of Indian Standards as an authentic and reliable base of India’s quality framework. “80” indicates the 80 years of service provided by BIS, while the BIS branding is incorporated into the zero as a way of emphasizing that standards are a core element of this process. The dynamic saffron, white, and green lines denote India’s endless journey towards improvement and the role played by standards in the development of a more quality-conscious nation. Blue stands for trust, reliability, and institutional authenticity. The circle design stands for consistency, continuity, and standardization, whereas the moving composition signifies innovation and India’s journey towards Viksit Bharat. The logo has been purposefully designed in a way that will allow it to retain its identity in digital media, official papers, print, banners, and any other application.","name":"Rishabhsinghchauhan_35","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790070153_7920166e.png"]},{"id":131961,"date":"22-09-2026 14:45:51","text":"The logo commemorates BIS@80 through a dynamic, ‘80’ crafted with precision Bèzier curves symbolising eight decades of trusted standards, continuity and progress. The Bureau of Indian Standards (BIS) emblem fits naturally within the symmetrical cuts of the ‘80’, placing the institution and its legacy at the heart of the design. The upward arrow, representing Viksit Bharat, symbolises India’s continuous progress towards becoming a developed nation. The colour palette of navy blue (#06038D), saffron (#FF9933) and green (#138808) reflects India’s national identity reinforcing trust, progress and growth. The interplay of flowing curves and angular forms represents the dynamism, strength and reliability of BIS. Montserrat lends the identity a clean, modern and highly legible character. Overall, the design celebrates BIS’s contribution to quality, reliability and consumer confidence, positioning quality infrastructure as a foundation for India’s journey towards Viksit Bharat.","name":"SaumyaBhardwaj","dob":"04-12-2007","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790068533_1b34d96f.pdf"]},{"id":131951,"date":"22-09-2026 14:32:28","text":"This image features a celebratory logo marking 80 years of the Bureau of Indian Standards (BIS), the National Standards Body of India.","name":"BhoumikSheokand","dob":"18-07-2008","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790067676_166d50f7.png"]},{"id":131941,"date":"22-09-2026 14:13:17","text":"The BIS@80 logo represents 80 years of trust, quality and progress. The number “80” forms the main structure of the design, symbolising a continuous journey from the foundation of BIS in 1947 to a future built on quality.\n\nThe BIS symbol is placed within the design to show that standards remain at the heart of this journey. The flowing saffron, white and green elements represent India and the forward movement of the nation. The upward movement reflects progress towards a Viksit Bharat.\n\nThe circular visual represents a cycle of standardisation, testing, conformity assessment and consumer awareness. The elements of infrastructure, people and development inside it show how standards reach beyond laboratories and become part of everyday life.\n\nOverall, the logo connects BIS’s past, present and future — from creating reliable standards to building confidence among consumers and supporting a stronger, safer and quality-conscious India.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790066586_b3e3a6b9.png"]},{"id":131939,"date":"22-09-2026 14:11:43","text":"The proposed BIS@80 commemorative logo celebrates eight decades of quality, trust, and standardization driven by the Bureau of Indian Standards. Designed in a clean, minimalist 2D vector format, the logo seamlessly integrates heritage with modern progression.\n​Integrity & Infinity (The '80' Emblem): The bold, stylized '80' incorporates an infinity loop design, symbolizing continuous dedication to quality and sustainable growth. The official BIS emblem is nested core within the zero loop, highlighting its central role in shaping national quality standards.\n​Sustainability & Growth (The Base Motif): The minimalist leaf motif at the bottom signifies eco-friendly standards, organic growth, and national prosperity.\n​Color Palette & Frame: Using official BIS Royal Blue (representing trust and authority) and Radiant Gold/Orange (signifying excellence and success), framed within a balanced double ring, the logo offers excellent scalability and recognition across digital platforms","name":"AritraDey","dob":"19-03-2007","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790066376_80e0226f.png"]},{"id":131931,"date":"22-09-2026 14:04:20","text":"The BIS@80 logo celebrates eight decades of the Bureau of Indian Standards (BIS) and its contribution to quality, safety, reliability and consumer confidence in India. The flowing “80” represents BIS’s journey of standardization, testing, conformity assessment and consumer empowerment, connecting its strong legacy with the vision of a Viksit Bharat. The upper section symbolizes industry, infrastructure, technology, innovation and sustainable development, reflecting sectors strengthened by standards. The lower section represents consumer safety, environmental responsibility and well-being, highlighting BIS’s citizen-centric approach. The integrated BIS emblem signifies trust, authenticity and India’s quality infrastructure, while elements inspired by the Indian Tricolour represent unity and national progress. Overall, the identity reflects 80 years of advancing standards and building a safer, sustainable and quality-driven India.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790066039_e40acaca.jpeg"]},{"id":131924,"date":"22-09-2026 13:50:33","text":"This commemorative logo for the BIS 80th Anniversary (1947–2027) is a cohesive emblem symbolizing its enduring legacy and future-forward vision.At its core, a large, stylized '80' integrates the Ashoka Lion Capital, representing national authority and trust. The '0' encases a glowing, interconnected map of India, signifying nationwide reach and digital integration. An outer circular border, adorned with traditional motifs and micro-gears, reflects eight decades of harmonizing heritage with industrial progress.The top arc features the national tricolor and the Hindi text \"विकसित भारत की नींव\" (Foundation of Developed India), underscoring BIS's pivotal role in national development.The three base icons—\"Empowered Citizen\" (certification), \"Informed Choices\" (magnifying glass), and \"Quality in Everyday Life\" (family)—illustrate the tangible benefits of standardization: safety, reliability, and consumer confidence. The deep blue, gold, and saffron palette evokes integrity and patriotism.","name":"IshaMutreja","dob":"01-07-2003","age":23,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790065035_f7edf061.png"]},{"id":131914,"date":"22-09-2026 13:26:23","text":"The BIS@80 logo celebrates eight decades of the Bureau of Indian Standards’ commitment to quality, safety, reliability and consumer confidence. The existing BIS logo is integrated into the design to preserve the identity and legacy of the institution.\n\nThe prominent “80” represents BIS’s remarkable eight-decade journey, while the flowing saffron, white and green elements reflect India’s national identity and the nation’s journey towards progress. The growing human-and-leaf symbol represents people, sustainability, growth and a better quality of life.\n\nThe design brings together the core values of Quality, Standards, Safety and Reliability, highlighting BIS’s role in strengthening India’s quality infrastructure. The reference to “Viksit Bharat” represents how standardization, testing, conformity assessment and consumer awareness contribute to a stronger and more developed India.","name":"Jayashree Rose","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790063758_48fda8a7.png"]},{"id":131912,"date":"22-09-2026 13:24:04","text":"BIS@80 – Art and Culture\n\nMinistry of Consumer Affairs, Food and Public Distribution\n\nRespected dignitaries, distinguished guests, colleagues, artists, and dear friends,\n\nIt is a great pleasure to be part of the BIS@80 celebrations, commemorating eight decades of the Bureau of Indian Standards and its contribution to quality, safety, reliability and excellence in our country.\n\nToday, as we focus on the theme “Art and Culture,” we are reminded that India’s identity is deeply connected with its rich and diverse cultural heritage.\n\nAs we celebrate 80 years of BIS, let us remember that India’s cultural heritage is a living heritage. It survives when we practice it, teach it, innovate with it and pass it on to future generations.\nLet us work together to build a future where Indian tradition, creativity, quality and innovation move forward hand in hand.\n\nThank you.\n\nJai Hind.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790063566_5ed81589.png"]},{"id":131908,"date":"22-09-2026 13:20:16","text":"This is a used for show viksit bharat and this time we show the strategy for logo OF VIKSHIT BHARAT and this image shows the our community company and the this is the show viksit bharat features and the benefits of the bharat the i am sharing our feeling with you sir select my  logo and the this photo and logo and sir this place i am in srikot srinagar Uttarakhand puri gadwal and i am sharing my logo and the banifit to the viksit bharat and the iam new download this app sir give me 1st prize and i am showing the same feeling better well sir iam like this type challenge the iam really know the this logo shared by many people sir iam reminder in this week my half yearly exam started so iam use the wonderful trick this logo you selected for more edits then iam rewarded so sar iam named by anuj bhatt iam ready in class 8 th and my school name is saraswati vidya mandir inter college srikot ganganali pauri garhwal uttarakhand so iam write this letter for you to select my project sir . Thanku","name":"Anuj","dob":"21-09-2026","age":0,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790062689_d7fdb1be.jpg"]},{"id":131901,"date":"22-09-2026 13:06:55","text":"The BIS@80 logo celebrates eight decades of BIS’s journey in promoting quality, safety, reliability and consumer confidence. The existing BIS logo is integrated with the number “80”, representing the organisation’s legacy and continued progress. The flowing tricolour element symbolises India’s growth and the journey towards a Viksit Bharat. Its upward movement represents progress through strong quality infrastructure. The design reflects BIS’s key contributions to standardization, testing, conformity assessment and consumer awareness, empowering citizens to make informed choices and making quality an essential part of everyday life. The concept is simple, distinctive, meaningful and easily recognisable, with a clean visual identity suitable for digital and print media, official documents, social media, banners and merchandise. It is also adaptable to monochrome formats while retaining clarity and identity.","name":"PRAJAPATI NAYAN MAHESHBHAI","dob":"09-09-2005","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790062695_cbfa0fee.png"]},{"id":131898,"date":"22-09-2026 13:05:26","text":"The BIS@80 logo celebrates eight decades of BIS’s commitment to quality, safety, reliability and consumer confidence. The existing BIS identity is integrated with the number “80” to represent its long journey and continued progress. The flowing tricolour ribbon symbolises India’s growth and the journey towards a Viksit Bharat. Its upward movement represents progress supported by strong quality infrastructure. The design reflects BIS’s role in standardization, testing, conformity assessment and consumer awareness, empowering citizens to make informed choices and making quality an integral part of everyday life. The concept is simple, distinctive, meaningful and easily recognisable, with a clean structure suitable for digital and print media, official documents, social media, banners and merchandise. It is also adaptable to monochrome applications without losing its identity.","name":"PRAJAPATI NAYAN MAHESHBHAI","dob":"09-09-2005","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790062521_ba745cea.png"]},{"id":131896,"date":"22-09-2026 13:03:48","text":"The BIS@80 logo celebrates 80 years of quality, safety, trust and national service. The bold “80” represents BIS’s enduring legacy, while the BIS emblem within the “0” preserves its established identity.\n\nThe flowing Indian tricolour symbolises national pride, unity and forward progress. Its upward movement reflects innovation, growth and India’s journey towards a stronger future.\n\nThe circular elements represent standards, precision, testing and certification, while the visual elements within the “8” reflect the balance of industry, technology and sustainability.\n\nThe clean, contemporary design connects BIS’s heritage with the aspirations of a modern India, creating a distinctive and versatile identity for its 80th anniversary.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790061745_a7f9b34a.jpeg"]},{"id":131889,"date":"22-09-2026 12:54:46","text":"BIS की 80 वर्षों की यात्रा — 1947 से आज तक, मानकों से विश्वास तक\n\t\t6 जनवरी 1947 को ISI की स्थापना से भारत में राष्ट्रीय मानकीकरण की नींव पड़ी। \n\t\t1955-56 में ISI चिह्न ने गुणवत्ता और मानकों के अनुरूपता को पहचान दी।\n\t\t1 अप्रैल 1987 को BIS के गठन से मानकीकरण, प्रमाणन, परीक्षण और अनुरूपता मूल्यांकन  को व्यापक आधार मिला। \n\t\tवर्ष 2000 में हॉलमार्किंग की जिम्मेदारी BIS को मिली, जिससे बहुमूल्य धातुओं की शुद्धता में उपभोक्ता विश्वास बढ़ा। \n\t\tBIS अधिनियम, 2016 ने इसकी भूमिका को और व्यापक बनाया। \n\t\t2021 में हॉलमार्किंग और HUID व्यवस्था ने पारदर्शिता को नई दिशा दी। \n\t\tआज BIS Care App के माध्यम से मानकों, प्रमाणन और हॉलमार्किंग की जानकारी सहज उपलब्ध है।\n\n1947 से आज तक (लगभग आठ दशकों की ) BIS की यात्रा भारत में गुणवत्ता, सुरक्षा, प्रमाणन  और उपभोक्ता विश्वास के निरंतर सुदृढ़ीकरण की यात्रा है।\n“मानक आज की आवश्यकता, गुणवत्ता कल की शक्ति और विश्वास भारत की पहचान।”\nBIS — मानकों से विश्वास तक और विश्वास से विकसित भारत तक।\n\nवंदे मातरम ! \n\n—झंखना देसाई ,\nएस.वी.एन.आई.टी. सूरत","name":"ZankhnaDesai","dob":"21-03-1977","age":45,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790061696_30ecbdc4.png"]},{"id":131886,"date":"22-09-2026 12:49:28","text":"This logo has a strong anniversary + national-progress concept. Here is a detailed design explanation you can use in a logo presentation, concept note, competition submission, or client pitch.\n\nBIS@80 — Logo Concept Details\n1. Core Concept\n\nBIS@80 represents 80 years of standards, trust, continuity and progress.\n\nThe central idea is to transform the number “80” into a dynamic visual identity, rather than simply placing “80” beside the BIS logo.\n\nBIS + 80 Years + Indian Identity + Progress = BIS@80","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790061500_44ef0e1d.png"]},{"id":131881,"date":"22-09-2026 12:40:38","text":"This logo represents trust, quality, Indian identity, progress, and modern connectivity. The flowing design symbolizes continuous growth and development, while the green and orange colors give it a strong Indian identity. The BIS symbol represents quality, standards, and reliability, while the **Ashoka Chakra** reflects India, progress, and movement. The text “80 Years of Standards & Trust” highlights experience and credibility. The @ symbol is creatively integrated into the flowing design, representing digital connectivity, communication, and technology.","name":"Minikhandelwal","dob":"26-12-1999","age":21,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790061019_2ffea9e1.jpg","https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790061019_d3383a9b.png"]},{"id":131879,"date":"22-09-2026 12:38:38","text":"Bureau of Indian Standards (BIS) is the National Standards Body of India. It develops and promotes standards for products, services and processes to ensure quality, safety and reliability. BIS also provides certification and helps protect consumers by promoting standardised and quality-assured products. It plays an important role in strengthening India’s quality ecosystem and supporting the country’s growth.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790060907_83fce530.pdf"]},{"id":131877,"date":"22-09-2026 12:37:33","text":"**Concept Note – BIS@80**\n\nThe BIS@80 logo celebrates eight decades of BIS in building a culture of quality, safety, reliability and consumer confidence in India.\n\nThe core visual is **“80”**, symbolising BIS’s enduring legacy and journey of excellence. The flowing **8** represents continuity, evolution and progress, while the **0** integrates the existing BIS identity, placing the institution at the heart of the anniversary mark.\n\nThe **saffron, white and green** flow reflects India and its forward-looking spirit, symbolising innovation and the journey towards a **Viksit Bharat**. Blue represents trust, credibility, standards and reliability.\n\nThe clean, distinctive and scalable design is suitable for digital, print, social media, official documents and merchandise, bringing together BIS’s **legacy, present commitment and vision for a quality-driven India**.\n\n**BIS@80 — Standards for a Brighter Tomorrow.**","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790060774_758549e0.png"]},{"id":131869,"date":"22-09-2026 12:27:47","text":"BIS@80 – Standards for a Developed India\n\nThis commemorative logo celebrates 80 years of India’s journey in standards, quality and consumer trust from 1947 to 2027. The bold number “80” represents continuity, strength and progress. The official BIS logo placed within zero highlights the organisation’s central role in national standardisation. Purple represents dignity, vision and excellence, while gold symbolises achievement and the historic 80-year milestone. The Hindi tagline “मानकों से विकसित भारत” expresses the contribution of standards towards building a safe, reliable and developed India. The circular form reflects unity, completeness and continuous advancement","name":"Anujkumar","dob":"07-05-2006","age":17,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790060305_c5c5fa96.pdf"]},{"id":131853,"date":"22-09-2026 11:54:54","text":"The BIS@80 logo represents the celebration of 80 years of the Bureau of Indian Standards (BIS) and highlights its contribution to quality, safety, reliability, and trust in India. The most prominent feature of the logo is the number “80”, which represents the 80-year journey of BIS. The number is designed using the three colours of the Indian national flag—saffron, white, and green, symbolising India’s identity and national pride.\nInside the “0” of the logo, the official BIS emblem is displayed. The BIS emblem represents standardisation, quality, and the protection of consumers through reliable standards. The Hindi motto “मानकः पथप्रदर्शकः” is included in the emblem, conveying the meaning that standards guide the way. The words “Bureau of Indian Standards” are also clearly shown below the emblem.Overall, the BIS@80 logo beautifully combines India’s identity, standardisation, quality, progress, and trust, while celebrating BIS’s remarkable 80-year journey.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790058259_545bd389.png"]},{"id":131847,"date":"22-09-2026 11:44:13","text":"The BIS@80 commemorative logo celebrates  80 years of India’s journey toward quality, safety, reliability and standardisation, from the establishment of the Indian Standards Institution in 1947 to India’s vision for 2047.\n\nThe  tricolour ribbon forming the number “8” represents India’s identity, unity and continuous progress, while the blue circular “0” incorporates the BIS identity and symbolises trust, standardisation and quality assurance. The map of India and Ashoka Chakra reflect national identity and BIS’s nationwide reach.\n\nThe rising lion and industrial skyline represent India’s growing manufacturing strength, innovation and self-reliance. Icons of  science, technology, sustainability and global connectivity highlight the expanding role of standards in modern India.\n\nGold accents signify the importance of the 80-year milestone, while the upward movement toward 2047 reflects India’s continuing journey toward a quality-driven and globally respected nation","name":"Vemuru Pooja sree","dob":"21-01-2006","age":20,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790057629_c72e9c18.png"]},{"id":131844,"date":"22-09-2026 11:41:33","text":"The logo honors the 80-year milestone (1947–2027) of the Bureau of Indian Standards (BIS), reflecting trust, national quality standards, and industrial progress.\nOfficial BIS Identity: Integrates the official standard emblem along with Hindi text (\"भारतीय मानक ब्यूरो\" and \"गुणवत्ता • विश्वास\") ensuring official credibility and recognition. \nTricolor Arcs: Incorporates Saffron and Green curved lines representing national identity and development.|\nGolden Laurel Wreath: Encircles the badge to symbolize 80 years of excellence and reliability.\nText & Ribbon: Includes a navy ribbon with \"80 YEARS OF TRUST | 1947–2027\" and \"BUREAU OF INDIAN STANDARDS\" at the base.","name":"KalyaniThirumani","dob":"26-08-2004","age":22,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790057290_9d0434ce.jpg"]},{"id":131843,"date":"22-09-2026 11:41:27","text":"I crafted this logo to symbolize 80 years of BIS as an ongoing journey marked by quality, safety, and trust. The number \"80\" serves as the focal point of the visual identity, representing eight decades of BIS’s contribution to India's quality infrastructure.\nThe 8 is designed as a fluid, interconnected shape, incorporating symbols that relate to key areas associated with BIS, such as testing, safety, hallmarking, certification, inspection, consumer awareness, standards, and collaboration. These elements collectively demonstrate how various facets of standardization work in harmony to integrate quality into daily life.\nThe BIS emblem is embedded within the 0, ensuring that the existing BIS identity remains central to the commemorative logo. The flowing saffron, white, and green components symbolize India and the ongoing journey towards a Viksit Bharat.","name":"Apoorva Choudhary","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790057433_14ceda4d.pdf"]},{"id":131841,"date":"22-09-2026 11:39:42","text":"Celebrating 80 years of quality, trust and standards 🇮🇳✨\nBureau of Indian Standards (BIS) has completed 80 remarkable years of contributing towards quality, safety and reliability in our everyday lives.\nAs a BIS Club, we feel proud to be a part of this journey and to spread awareness about the importance of standards among students and society.\n80 years is not just a milestone, it’s a reminder of the trust built over generations. Here’s to learning, growing and contributing towards a better and quality-driven future.\nHappy 80th Anniversary, BIS! 🎉\n#BISAt80 #BISClub #80YearsOfQuality #QualityAndTrust #BureauOfIndianStandards","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790057249_2436a579.png"]},{"id":131839,"date":"22-09-2026 11:35:50","text":"The logo is built around “80” as one continuous symbol, representing BIS’s 80-year journey.\n\n\n\nThe 8 is designed like an infinity loop, symbolising continuity, trust and BIS’s commitment to quality across eight decades.\n\nThe 0 represents an open circle — India’s progress and a vision extending into the future.\n\nThe existing BIS emblem is placed at the heart of the 80, making BIS the foundation of the entire design rather than just an added element.\n\nBlue represents reliability, standards and institutional trust.\n\nSaffron, white and green flowing accents subtly connect the identity with India without making the logo overly complicated.\n\nThe continuous flowing lines represent how standards connect everyday life, industry, technology, safety and national development.\n\nThe bold BIS@80 below makes the commemorative purpose immediately recognisable.\n\n“80 Years of Standards. One Continuous Commitment.”","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790057125_0f909924.png"]},{"id":131836,"date":"22-09-2026 11:33:34","text":"The identity of BIS@80 draws inspiration from the thought of 80 years of setting standards and establishing the path to India’s future.\n\nThe central “80” forms the core of the logo, representing BIS’s eight decades of service, placing trust and standardisation at the heart of the identity.\n\nThe vertical \"door-like form\" between the 8 and 0 symbolises an open door to progress, opportunity and a better future.\n\nThe \"golden rays\" radiating outward signify the spread of knowledge, quality and standards across the nation, while also creating a sense of optimism and forward movement.\n\nThe BIS hallmark and red dot retain the visual connection with BIS’s established identity and represent authenticity and assurance. The sweeping \"blue and gold lines\" at the base provide a sense of stability, continuity and progress.\n\nOverall, the design brings together legacy, trust, progress and a forward-looking India in a single visual identity.","name":"IftikarKhan","dob":"16-06-2004","age":17,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790057005_c4227b38.png"]},{"id":131826,"date":"22-09-2026 11:26:00","text":"The logo represents BIS's 80-year journey of building trust through quality, safety and standardisation. The BIS symbol forms the foundation of the design, symbolising reliability and strong standards. The number 80 represents eight decades of BIS's contribution to quality infrastructure in India. The flowing saffron, white and green elements represent India's progress and the organisation's role in supporting a quality-driven Viksit Bharat. The clean and scalable design ensures easy recognition across digital platforms, print, official documents and public communication.","name":"ShrutiVarat","dob":"10-11-2002","age":20,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790056550_8c60bd2d.jpg"]},{"id":131818,"date":"22-09-2026 11:07:28","text":"My design celebrates BIS@80 by combining the journey of Indian Standards with the values of quality, safety, trust and national progress. The number “80” represents the 80-year legacy, while the Indian tricolour and BIS-inspired elements reflect India’s standards journey and its commitment to a safer, stronger future.","name":"Payal Tripathi","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790055439_660d6d32.png"]},{"id":131814,"date":"22-09-2026 11:03:01","text":"Use the uploaded official BIS logo as an integral and recognizable part of the new commemorative design. Create a unique, modern and professional “BIS@80” logo celebrating 80 years of the Bureau of Indian Standards. Preserve the identity and proportions of the official BIS emblem without distorting or recreating it. Develop a distinctive geometric “80” symbol representing eight decades of excellence, quality, safety, reliability and consumer confidence. Integrate subtle saffron, white and green elements to represent India and progress toward Viksit Bharat, avoiding generic flag imagery. The design should communicate continuity, trust, innovation and national progress through clean shapes and meaningful negative space. Keep the composition simple, memorable, balanced and highly recognizable. It must work effectively in colour and monochrome and remain clear when scaled for official documents, certificates, websites, social media, banners and merchandise.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790055114_b81e2338.png"]},{"id":131807,"date":"22-09-2026 10:49:58","text":"My logo brings together the familiar BIS identity with the milestone of 80 years in a simple, modern way.\nThe flowing “8” reflects continuity and eight decades of trust, while the tricolour “0” connects BIS’s journey with India’s progress towards a Viksit Bharat.\nBlue represents trust and reliability, while red adds energy and commitment.\nTogether, the design celebrates BIS’s legacy while looking confidently towards the future.","name":"NadarShiva","dob":"16-12-2003","age":22,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790054231_431c97b0.png"]},{"id":131805,"date":"22-09-2026 10:49:04","text":"Design Concept: BIS@80 Commemorative Logo\n\nThis logo commemorates 80 years of standardisation and quality assurance by the Bureau of Indian Standards (BIS) in nation-building:\n\nNumeral '80': Crafted in a dynamic ribbon/infinity style, reflecting 80 years of continuous growth, trust, and progressive standardization.\n\nOfficial BIS Mark: Centered inside the numeral '0' as the core identity, highlighting certified quality and reliability.\n\nNational Tricolour Ribbon & Chakra: Underpins the numeral, symbolizing BIS's unwavering service, national pride, and dedication to Atmanirbhar Bharat.\n\nFour Pillar Quadrants (Gears, Shield, Community, Leaf):\n\nGear: Industrial precision, manufacturing excellence, and technological standards.\n\nShield: Consumer protection and product safety.\n\nCommunity: Public welfare, accessibility, and inclusivity.\n\nLeaf: Sustainable development, eco-standards, and green practices.","name":"AnjulGautam","dob":"09-10-2005","age":19,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790054327_0b581544.jpg"]},{"id":131801,"date":"22-09-2026 10:42:40","text":"The BIS@80 identity transforms the number 80 into a unified representation of eight decades of India's journey towards quality. The integrated BIS identity at the heart of the mark represents BIS as the foundation of the nation's quality infrastructure. The continuous geometric structure symbolises standardisation, measurement, testing and conformity assessment, while its interconnected form reflects safety, reliability and consumer confidence. The progression within the mark represents the evolution of quality from standards and verified products to better everyday lives and a stronger, more developed India. The restrained blue-and-gold visual language conveys institutional trust, excellence and continuity. Designed as a simple and scalable identity, the mark is intended to remain recognisable across digital, print, official communication, merchandise and monochrome applications.","name":"subramanyamreddy","dob":"10-04-1997","age":28,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790053870_4b1e743f.png"]},{"id":131799,"date":"22-09-2026 10:35:25","text":"The BIS@80 logo reflects today’s world of rapid innovation, global trade, and informed consumers. Its bold blue “80” honours eight decades of the Bureau of Indian Standards, while the tricolour ribbon and rising arrow over India signal national progress and Viksit Bharat. The zero encloses BIS’s emblem, reinforcing certification, safety, and reliability. Four modern icons—quality, testing, conformity assessment, and consumer awareness—show how standards empower everyday choices in a digital, quality-conscious marketplace. The tagline “Quality for a Better Tomorrow” connects credibility with sustainability and future readiness. In an era of fake products, online markets, and climate challenges, the logo presents BIS as a trusted bridge between industry, citizens, and global benchmarks. The design’s clean typography and vibrant colours make it memorable across digital platforms, reports, and public campaigns. It celebrates the past but speaks to today’s demand for transparency,","name":"Sujit Oraon","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790053437_0de15e59.png"]},{"id":131793,"date":"22-09-2026 10:28:59","text":"Option 1: Foundations of Trust\nAn architectural 80 base supports an ascending flame with the BIS mark, surrounded by icons for testing and standards to represent the bedrock of Viksit Bharat.  \nOption 2: Infinite Loop of Quality\nTransforms the 80 into an infinity symbol blending the tricolor ribbon, BIS logo, and Ashoka Chakra to depict continuous progress and consumer trust.  \nOption 3: Rising Star of Standards\nFeatures India’s map with an ascending tricolor sweep through a golden 80 toward a star, anchored by BIS to signify global leadership and nationwide reach.","name":"NithunS","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790052933_8f326f50.png"]},{"id":131792,"date":"22-09-2026 10:26:51","text":"The BIS@80 commemorative logo celebrates eight decades of the Bureau of Indian Standards as India’s National Standards Body and its continuing contribution to quality, safety, reliability and consumer confidence.\n\nThe design integrates the existing BIS identity with a prominent “80”, symbolising the organisation’s eight-decade journey. The flowing circular form represents continuity, progress and the ever-expanding reach of standards in everyday life. The use of the national colours reflects India’s aspirations towards a Viksit Bharat.\n\nThe surrounding symbols represent key areas of BIS’s work: quality assurance, safety, testing, conformity assessment, consumer awareness and trust. The central composition brings these elements together to convey how strong standards and quality infrastructure support informed choices, safe products and sustainable national \n\nThe clean and scalable visual language is intended to remain recognisable across digital platforms, official document","name":"AbhishekRaghuwanshi","dob":"16-06-2005","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790053005_22959932.png"]},{"id":131788,"date":"22-09-2026 10:24:58","text":"The BIS@80 commemorative logo celebrates eight decades of the Bureau of Indian Standards as India’s National Standards Body and its continuing contribution to quality, safety, reliability and consumer confidence.\n\nThe design integrates the existing BIS identity with a prominent “80”, symbolising the organisation’s eight-decade journey. The flowing circular form represents continuity, progress and the ever-expanding reach of standards in everyday life. The use of the national colours reflects India’s aspirations towards a Viksit Bharat.\n\nThe surrounding symbols represent key areas of BIS’s work: quality assurance, safety, testing, conformity assessment, consumer awareness and trust. The central composition brings these elements together to convey how strong standards and quality infrastructure support informed choices, safe products and sustainable national development.\n\nThe clean and scalable visual language is intended to remain recognisable acros","name":"AbhishekRaghuwanshi","dob":"16-06-2005","age":18,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790052886_6b1a5c68.png"]},{"id":131787,"date":"22-09-2026 10:24:03","text":"This stunning commemorative logo celebrates 80 Years of Trust (1947–2027) for the Bureau of Indian Standards. Framed by an elegant golden and blue laurel wreath, the design features a prominent, beautifully styled \"80\" emblem. Inside the loops of the number, miniature icons highlight scientific testing, global connectivity, sustainable green energy, and modern urban infrastructure. Crowning the badge is the official BIS standard mark alongside bilingual text symbolizing quality, safety, and reliability..","name":"PariKumariGupta","dob":"11-05-2002","age":23,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790052829_4ff7e849.png"]},{"id":131775,"date":"22-09-2026 09:56:55","text":"This design captures the essence of BIS@80 by connecting eight decades of quality, standards, and safety from 1947 to 2027 with the forward-looking vision of a Viksit Bharat in 2047. The central BIS standard mark anchors the design in national trust, while the integrated '80' and upward-sweeping elements symbolize continuous progress, reliability, and consumer confidence.\"","name":"PariKumariGupta","dob":"11-05-2002","age":23,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790051167_f809a6fc.png"]},{"id":131773,"date":"22-09-2026 09:52:09","text":"The BIS@80 logo is set within a protective shield, symbolising eight decades of safeguarding quality, safety and consumer confidence.\nThe bold “80” forms the core: the flowing blue “8” represents continuity of standardisation since 1947, while the golden “0” is a precision gear. At its centre sits the official BIS logo, affirming the existing identity as the integral foundation. The gear denotes industry, testing, conformity assessment and the quality infrastructure that enables reliable products and informed citizen choices.\nBlue conveys trust; gold marks the golden milestone of 80 years. The shield reinforces institutional strength protecting consumers.\nThe phrases “Years of Quality & Trust” and “Viksit Bharat” link BIS’s legacy to its role in building a developed India through strong standards.\nClean geometry and a restrained palette ensure the design remains simple, distinctive and fully scalable in both colour and monochrome, suitable for digital, print, documents and banners.","name":"JaineelJoshi","dob":"10-06-2011","age":14,"urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790050566_5f6e5b0c.png"]},{"id":131746,"date":"22-09-2026 09:03:34","text":"The BIS@80 logo represents eight decades of building trust through quality, standards and safety. The existing BIS emblem is integrated with the number 80, making the milestone itself the central visual identity.\n\nThe “8” symbolises continuity, an unbroken journey of eight decades, while the flowing form suggests BIS’s continuing movement towards innovation and higher standards. The “0” is designed as a circular ecosystem, representing the interconnected pillars of standardisation, testing, conformity assessment, safety and consumer awareness.\n\nThe Indian tricolour-inspired flow represents the journey from strong quality infrastructure to a stronger and more self-reliant India. The upward movement symbolises progress towards Viksit Bharat, while the human element at the centre reflects the ultimate purpose of standards — people, trust and better everyday life.\n\nThe design is intentionally clean, modern and scalable so that it remains recognisable across official","name":"7908297213","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790047983_f347e7a7.png"]},{"id":131738,"date":"22-09-2026 08:21:16","text":"I designed this logo to represent the 80 years of BIS and its contribution towards quality and safety in India.\n\nThe number “80” is kept as the main focus because it represents the 80th anniversary of BIS.\nThe BIS symbol is placed inside the “0” to connect the anniversary directly with the organisation.\nI used blue and gold to give the logo a professional and commemorative look.\nThe saffron and green curves represent India and give the design a national touch.\nThe flowing curves also show the continuous growth and progress of BIS over the years.\nI kept the overall design simple, clean and easy to recognise, so it can work on posters, certificates, websites and other official materials.\nThe design represents the idea of trust, quality, safety and progress, which are important parts of BIS.\n\nOverall, I wanted the logo to look modern while still showing the importance of BIS’s 80-year journey.","name":"-","dob":"-","age":"-","urls":["https://static.mygov.in/static/resources/s3fs-public/2026-09/mygov_1790045352_ba606ebf.png"]},{"id":131736,"date":"22-09-2026 07:53:24","text":"The BIS@80 logo shown in the image is a meaningful and attractive representation of the Bureau of Indian Standards (BIS) and its journey of eight decades. The design combines the identity of BIS with the colours and symbols associated with India. It communicates important ideas such as quality, safety, trust, national unity, progress, standardisation
